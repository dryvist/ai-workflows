name: Run AI agent
description: >-
  Run the selected AI coding agent with a common, least-privilege interface.
  Both agents talk to the org's model router and nothing else: Claude Code
  through its /v1/messages route, Codex through its /v1/responses route. A
  model name is a router role alias, never a vendor id.

inputs:
  agent:
    description: AI agent to run. Supported values are claude and codex.
    required: false
    default: claude
  prompt:
    description: Rendered prompt content sent to the selected agent.
    required: true
  claude_model:
    description: Optional Claude model override. An empty value uses the provider default.
    required: false
    default: ""
  codex_model:
    description: >-
      Optional Codex role override. An empty value uses claude_model: a
      router role is provider-neutral, and the provider default would be a
      vendor id the router does not serve.
    required: false
    default: ""
  model:
    description: Deprecated compatibility alias for claude_model.
    required: false
    default: ""
  allowed_tools:
    description: >-
      Claude allowed-tools expression. Codex authorization is controlled by
      permission_profile instead.
    required: false
    default: ""
  claude_args:
    description: Additional arguments passed to Claude Code.
    required: false
    default: ""
  codex_args:
    description: Additional arguments passed to Codex.
    required: false
    default: ""
  base_url:
    description: >-
      Router base URL ending in /v1. Claude Code is pointed at its parent
      (it appends /v1/messages itself) and Codex at its /responses child.
    required: true
  api_key:
    description: Router key sent as the bearer token by both agents.
    required: true
  openai_effort:
    description: Optional Codex reasoning-effort override.
    required: false
    default: ""
  effort:
    description: Deprecated compatibility alias for openai_effort.
    required: false
    default: ""
  codex_version:
    description: Optional Codex CLI version override.
    required: false
    default: ""
  permission_profile:
    description: Codex permission profile. Accepts read-only, workspace, or an explicit profile name.
    required: false
    default: read-only
  working_directory:
    description: Optional Codex working directory. An empty value uses the repository root.
    required: false
    default: ""
  allowed_bots:
    description: Comma-separated trusted bot logins that may invoke the provider action.
    required: false
    default: github-actions
  show_full_output:
    description: >-
      Show full Claude output, including tool results, in action logs. Enable
      only for private, non-sensitive debugging because output may contain secrets.
    required: false
    default: "false"
  litellm_tags:
    description: Comma-separated LiteLLM request tags for flow attribution.
    required: false
    default: ""
  otel_traces_endpoint:
    description: Optional OTLP traces endpoint for Claude Code telemetry.
    required: false
    default: ""
  otel_resource_attributes:
    description: Comma-separated OpenTelemetry resource attributes.
    required: false
    default: ""
  allowed_users:
    description: Comma-separated GitHub users Codex may allow in addition to repository writers.
    required: false
    default: ""
  inject_instructions:
    description: >-
      Whether to load the canonical dryvist agent instructions into both
      providers' user-level instruction locations.
    required: false
    default: "true"
  ntfy_base_url:
    description: >-
      Optional ntfy hub base URL for the ops alert sent when the Claude run
      hits a gateway, budget or 429 failure. Empty skips the alert.
    required: false
    default: ""
  claude_bot_app_id:
    description: >-
      Claude bot App ID (vars.GH_APP_CLAUDE_BOT_ID). Mints the token that posts
      the neutral check run on a gateway failure. Empty fails the job on that path.
    required: false
    default: ""
  claude_bot_private_key:
    description: >-
      Claude bot App private key (secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY). Used
      only on a gateway failure. Empty fails the job on that path.
    required: false
    default: ""

outputs:
  gateway_class:
    description: >-
      Reason class when the Claude run failed on a gateway, budget or 429
      error. The job does not fail in that case and the result is empty. Empty
      otherwise.
    value: ${{ steps.report.outputs.gateway_class }}
  agent:
    description: >-
      Agent that ran. Reflects a runtime fallback (codex ran but failed,
      e.g. exhausted provider quota) to claude.
    value: >-
      ${{ steps.codex.outcome == 'failure' && steps.claude.outcome == 'success' && 'claude (codex fallback)' || steps.prepare.outputs.effective-agent }}
  result:
    description: >-
      Normalized provider result. This is Claude structured output when
      available, otherwise the Claude execution artifact path, or the final
      Codex message.
    value: ${{ steps.claude.outputs.structured_output || steps.claude.outputs.execution_file || steps.codex.outputs['final-message'] }}
  structured_output:
    description: Claude structured output, when the prompt requests a JSON schema.
    value: ${{ steps.claude.outputs.structured_output }}
  execution_file:
    description: Claude execution artifact path, when Claude ran.
    value: ${{ steps.claude.outputs.execution_file }}
  branch_name:
    description: Branch created by Claude Code, when applicable.
    value: ${{ steps.claude.outputs.branch_name }}
  final_message:
    description: Final Codex message, when Codex ran.
    value: ${{ steps.codex.outputs['final-message'] }}

runs:
  using: composite
  steps:
    - name: Validate agent configuration
      id: prepare
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        API_KEY: ${{ inputs.api_key }}
        BASE_URL: ${{ inputs.base_url }}
        CLAUDE_ARGS: ${{ inputs.claude_args }}
        CLAUDE_MODEL: ${{ inputs.claude_model || inputs.model }}
        PERMISSION_PROFILE: ${{ inputs.permission_profile }}
      run: '"$GITHUB_ACTION_PATH/prepare.sh" validate'

    - name: Checkout canonical agent instructions
      if: inputs.inject_instructions == 'true'
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: dryvist/ai-assistant-instructions
        ref: main
        sparse-checkout: |
          AGENTS.md
          agentsmd/rules
        path: .ai-instructions
        persist-credentials: false

    - name: Install canonical agent instructions
      if: inputs.inject_instructions == 'true'
      shell: bash
      env:
        CODEX_HOME: ${{ runner.temp }}/codex-home
        INSTRUCTION_SOURCE: ${{ github.workspace }}/.ai-instructions
      run: '"$GITHUB_ACTION_PATH/prepare.sh" inject'

    - name: Remove canonical instructions checkout
      if: always()
      shell: bash
      run: '"$GITHUB_ACTION_PATH/prepare.sh" cleanup'

    # Codex runs first (when selected) for two reasons: its drop-sudo safety
    # strategy permanently removes sudo for the rest of the job, and a failed
    # Codex run (e.g. exhausted provider quota) needs Claude to still be able
    # to run afterward as a fallback — continue-on-error keeps that failure
    # from stopping the job here. If Claude's own key is unavailable or also
    # fails, the Claude step below fails for real and the job fails honestly.
    # drop-sudo refuses to run as root, so on a root runner Codex runs as a
    # dedicated non-root user instead (see select-codex-user.sh).
    - name: Select Codex run user
      id: codex-user
      if: steps.prepare.outputs.effective-agent == 'codex'
      shell: bash
      env:
        CODEX_HOME_DIR: ${{ runner.temp }}/codex-home
        CODEX_WORK_DIR: ${{ inputs.working_directory || github.workspace }}
      run: bash "$GITHUB_ACTION_PATH/select-codex-user.sh"

    - name: Run Codex
      id: codex
      if: steps.prepare.outputs.effective-agent == 'codex'
      continue-on-error: true
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      env:
        # Read operations such as `gh issue view` use the job-scoped token.
        # Agent jobs must keep this token read-only; publishers run separately.
        GH_TOKEN: ${{ github.token }}
      with:
        prompt: ${{ inputs.prompt }}
        openai-api-key: ${{ inputs.api_key }}
        responses-api-endpoint: ${{ steps.prepare.outputs.responses-endpoint }}
        working-directory: ${{ inputs.working_directory }}
        permission-profile: ${{ steps.prepare.outputs.permission-profile }}
        model: ${{ inputs.codex_model || inputs.claude_model || inputs.model }}
        effort: ${{ inputs.openai_effort || inputs.effort }}
        codex-version: ${{ inputs.codex_version }}
        codex-args: ${{ inputs.codex_args }}
        codex-home: ${{ runner.temp }}/codex-home
        safety-strategy: ${{ steps.codex-user.outputs.safety-strategy }}
        codex-user: ${{ steps.codex-user.outputs.codex-user }}
        allow-bots: ${{ inputs.allowed_bots != '' && 'true' || 'false' }}
        allow-bot-users: ${{ inputs.allowed_bots }}
        # The runner and event context expose the scheduled actor as the bare login.
        allow-users: >-
          ${{ github.event_name == 'schedule' && github.actor == 'github-actions' && format('{0}{1}github-actions', inputs.allowed_users, inputs.allowed_users != '' && ',' || '') || inputs.allowed_users }}

    - name: Run Claude Code
      id: claude
      if: >-
        steps.prepare.outputs.effective-agent == 'claude' ||
        steps.codex.outcome == 'failure'
      # Failure is judged by the report step below: a gateway, budget or 429
      # error ends the job without failing it, any other error still fails it.
      continue-on-error: true
      uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
      env:
        # The CLI's own variable name; it points at the router.
        ANTHROPIC_BASE_URL: ${{ steps.prepare.outputs.claude-base-url }}
        ANTHROPIC_CUSTOM_HEADERS: "${{ inputs.litellm_tags != '' && format('x-litellm-tags: {0}', inputs.litellm_tags) || '' }}"
        CLAUDE_CODE_ENABLE_TELEMETRY: ${{ inputs.otel_traces_endpoint != '' && '1' || '0' }}
        CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: ${{ inputs.otel_traces_endpoint != '' && '1' || '0' }}
        CLAUDE_CODE_PROPAGATE_TRACEPARENT: ${{ inputs.otel_traces_endpoint != '' && '1' || '0' }}
        OTEL_TRACES_EXPORTER: ${{ inputs.otel_traces_endpoint != '' && 'otlp' || 'none' }}
        OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ inputs.otel_traces_endpoint }}
        OTEL_RESOURCE_ATTRIBUTES: ${{ inputs.otel_resource_attributes }}
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
        OTEL_LOG_USER_PROMPTS: "0"
        OTEL_LOG_TOOL_DETAILS: "0"
        OTEL_LOG_TOOL_CONTENT: "0"
        OTEL_LOG_RAW_API_BODIES: "0"
      with:
        # Supplying the job-scoped token prevents Claude Code Action from
        # exchanging OIDC for its own write-capable GitHub App token.
        github_token: ${{ github.token }}
        # The action's own input name; it carries the router key.
        anthropic_api_key: ${{ inputs.api_key }}
        allowed_bots: ${{ inputs.allowed_bots }}
        show_full_output: ${{ inputs.show_full_output }}
        use_commit_signing: "false"
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ steps.prepare.outputs.claude-args }}

    - name: Report sanitized Claude error
      id: report
      if: always() && steps.claude.outcome != 'skipped'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        STEP_OUTCOME: ${{ steps.claude.outcome }}
        ROUTER_API_KEY: ${{ inputs.api_key }}
        CLAUDE_GITHUB_TOKEN: ${{ steps.claude.outputs.github_token }}
      run: node "$GITHUB_ACTION_PATH/report-error.js"

    # The check run is posted with the Claude bot App token, minted only on a
    # gateway failure. A failed mint is named by the report step, which then fails.
    - name: Mint the check-run token
      id: check-token
      if: always() && steps.claude.outcome == 'failure' && steps.report.outputs.gateway_class != ''
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.claude_bot_app_id }}
        private-key: ${{ inputs.claude_bot_private_key }}
        permission-checks: write

    - name: Report gateway unavailability
      if: always() && steps.claude.outcome == 'failure' && steps.report.outputs.gateway_class != ''
      shell: bash
      env:
        GATEWAY_CLASS: ${{ steps.report.outputs.gateway_class }}
        NTFY_BASE_URL: ${{ inputs.ntfy_base_url }}
        JOB_NAME: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Advisory: a gateway failure ends neutral.
        CONCLUSION: neutral
        GITHUB_TOKEN: ${{ steps.check-token.outputs.token }}
        CHECK_TOKEN_CAUSE: ${{ inputs.claude_bot_private_key == '' && 'claude_bot_private_key input is not set (the caller must pass GH_APP_CLAUDE_BOT_PRIVATE_KEY)' || 'the mint step failed' }}
        CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/shared/gateway-failure.sh" report "$JOB_NAME" "$GATEWAY_CLASS"

    - name: Fail on Claude errors that are not gateway errors
      if: always() && steps.claude.outcome == 'failure' && steps.report.outputs.gateway_class == ''
      shell: bash
      run: |
        echo "::error::Claude Code failed with an error that is not a gateway, budget or 429 failure."
        exit 1
