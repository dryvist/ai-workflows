name: Run Claude Code with bot attribution
description: >-
  Mints a JacobPEvans-claude App installation token and invokes
  anthropics/claude-code-action@v1 with that token, so every commit and PR
  comment is attributed to JacobPEvans-claude[bot] via the Contents API
  web-flow signing path. Centralizes the token-mint and action invocation
  that previously had to be copy-pasted into every reusable workflow.

inputs:
  prompt:
    # NOTE: descriptions must not contain `${{ ... }}` expression syntax — the
    # runner evaluates expressions inside action metadata and fails the job at
    # load time with "Unrecognized named-value" for contexts (steps/vars/
    # secrets) that do not exist there.
    description: Rendered prompt content sent to Claude (typically the caller's `steps.prompt.outputs.content`).
    required: true
  model:
    description: >-
      Model name forwarded as `--model`. The caller resolves the appropriate
      `vars.GH_ACTION_AI_MODEL_*` chain; this action does not pick a default.
    required: true
  allowed_tools:
    description: >-
      Full --allowedTools value forwarded inside `claude_args`. Each caller
      owns its own tool scope so the policy stays visible in the workflow.
    required: true
  claude_code_oauth_token:
    description: >-
      Claude Code OAuth token, sourced from the caller's
      `secrets.GH_ACTION_AI_API_KEY`. Pass-through; treat as secret at the caller.
    required: true
  app_id:
    description: JacobPEvans-claude App ID, e.g. the caller's `vars.GH_APP_CLAUDE_BOT_ID`.
    required: false
    default: ""
  app_private_key:
    description: JacobPEvans-claude App private key PEM, e.g. the caller's `secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY`.
    required: false
    default: ""
  allowed_bots:
    description: Comma-separated bot logins claude-code-action may process.
    required: false
    default: github-actions
  use_commit_signing:
    description: >-
      "true" to route commits through the Contents API (web-flow signed and
      attributed to the App). "false" for review-only callers that make no
      commits.
    required: false
    default: "true"
  inject_instructions:
    description: >-
      "true" (default) checks out dryvist/ai-assistant-instructions@main and
      appends its AGENTS.md + agentsmd/rules to Claude's system prompt (via
      claude_args --append-system-prompt), so the CI run shares the same baseline
      instructions as a local dev machine. Set "false" to opt a caller out.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate configuration
      shell: bash
      env:
        OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        APP_ID: ${{ inputs.app_id }}
        APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        USE_COMMIT_SIGNING: ${{ inputs.use_commit_signing }}
      run: |
        if [ -z "$OAUTH_TOKEN" ]; then
          echo "::error::claude_code_oauth_token is required (map the caller's secrets.GH_ACTION_AI_API_KEY)"
          exit 1
        fi

        # GitHub App credentials must be supplied together (both or neither).
        # A partial pair silently disables App-token minting and the run would
        # fall back to github.token — masking a misconfiguration.
        if { [ -n "$APP_ID" ] && [ -z "$APP_PRIVATE_KEY" ]; } || { [ -z "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; }; then
          echo "::error::app_id and app_private_key must be provided together (both or neither)"
          exit 1
        fi

        # Commit-writing workflows require the GitHub App so commits are signed
        # and attributed to the bot via the Contents API web-flow path. Without
        # App credentials, commits would be attributed to github-actions[bot].
        if [ "$USE_COMMIT_SIGNING" = "true" ] && [ -z "$APP_ID" ]; then
          echo "::error::use_commit_signing is 'true' but no GitHub App credentials were provided (app_id/app_private_key). Provide them for verified, bot-attributed commits, or set use_commit_signing to 'false' for review-only workflows."
          exit 1
        fi

    - name: Mint JacobPEvans-claude installation token
      id: app-token
      if: inputs.app_id != '' && inputs.app_private_key != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}

    # Give the CI run the same user-level instruction layer a local dev machine
    # has via nix. claude-code-action@v1 does not load the runner's user memory
    # (~/.claude) and exposes no append_system_prompt input, so the canonical
    # instructions are appended to the system prompt via claude_args instead. The
    # checkout is removed after assembly so it is never staged into a verified commit.
    - name: Checkout canonical agent instructions
      if: inputs.inject_instructions == 'true'
      uses: actions/checkout@v6
      with:
        repository: dryvist/ai-assistant-instructions
        ref: main
        sparse-checkout: |
          AGENTS.md
          agentsmd/rules
        path: .ai-instructions

    - name: Build claude_args (with canonical instructions)
      id: build-args
      shell: bash
      env:
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        MODEL: ${{ inputs.model }}
        INSTRUCTIONS_DIR: ${{ inputs.inject_instructions == 'true' && format('{0}/.ai-instructions', github.workspace) || '' }}
        # Pass via env (not inline ${{ }}) so the value never lands in the shell
        # command line — avoids CodeQL actions/code-injection.
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/../../scripts/shared/build-claude-args.sh"

    # Separate, always-run cleanup so the checkout is removed even if the build
    # step fails — it must never be left in the working tree for a verified commit.
    - name: Remove canonical instructions checkout
      if: always()
      shell: bash
      run: rm -rf "${GITHUB_WORKSPACE}/.ai-instructions"

    - name: Run Claude Code
      uses: anthropics/claude-code-action@v1
      with:
        github_token: ${{ steps.app-token.outputs.token || github.token }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        allowed_bots: ${{ inputs.allowed_bots }}
        use_commit_signing: ${{ inputs.use_commit_signing }}
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ steps.build-args.outputs.claude_args }}
