name: Wait for the router
description: >-
  Probe an OpenAI-compatible endpoint for at most fifteen seconds, then fail.
  curl's own retry does the work: a connection failure, 408, 429 or 5xx is
  retried twice, five seconds apart, inside a fifteen-second budget; a 401,
  403 or 404 (wrong key or base URL) fails at once. There is no
  succeed-on-outage path — a green check that reviewed nothing is worse
  than a red one — and the job never holds a runner past those seconds.

inputs:
  base_url:
    description: OpenAI-compatible base URL, ending in /v1 (a secret, so the log masks it).
    required: true
  api_key:
    description: Bearer key for that endpoint.
    required: true

runs:
  using: composite
  steps:
    - name: Probe the endpoint
      shell: bash
      env:
        BASE_URL: ${{ inputs.base_url }}
        API_KEY: ${{ inputs.api_key }}
      run: >-
        curl -sS --fail -o /dev/null --max-time 5
        --retry 2 --retry-delay 5 --retry-max-time 15
        -H "Authorization: Bearer $API_KEY" "${BASE_URL%/}/models"
