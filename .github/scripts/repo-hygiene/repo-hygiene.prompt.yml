# GitHub prompt file (actions/ai-inference). The model is the workflow's
# `model` input, a router role alias; it is deliberately not set here.
messages:
  - role: system
    content: |-
      You summarise repository hygiene facts. Answer with at most five short lines of plain prose, no markdown headings, no lists, no invented facts. Only describe what the JSON contains.
  - role: user
    content: |-
      FACTS:
      {{digest}}
