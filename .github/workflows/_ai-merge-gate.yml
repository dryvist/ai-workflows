# Reusable: AI Merge Gate
#
# Status aggregator: checks if any Copilot agent runs have failed on this PR.
# Passes immediately if no failures detected (agents still running = pass).
# Branch protection requires only "AI Merge Gate" as the single AI check.
# The decision, with every Copilot check-run it counted, is written to the
# job summary by .github/scripts/ai-merge-gate/check.sh.
#
# Usage:
#   uses: dryvist/ai-workflows/.github/workflows/_ai-merge-gate.yml@main
name: _ai-merge-gate

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      scripts_ref:
        description: >-
          Commit or ref of dryvist/ai-workflows to take the scripts from.
          Defaults to its default branch. A dogfood caller in this repository
          passes the pull request head SHA so the pull request exercises its
          own scripts.
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  checks: read
  contents: read

jobs:
  check:
    name: AI Merge Gate
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ inputs.scripts_ref }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      # The decision - curl's own retry against the check-runs API, the
      # Copilot filter, the job-summary table - lives in the script; this
      # step is one invocation.
      - name: Verify Copilot agent checks
        env:
          REPO: ${{ github.repository }}
        run: bash .ai-workflows/.github/scripts/ai-merge-gate/check.sh
