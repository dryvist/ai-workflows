---
# Caller-contract canary for the reusable workflows this repo publishes.
#
# Each fixture job calls one reusable at the commit under test through its local
# path (./.github/workflows/<file>.yml). A pull request runs the PR's own
# reusables; a push to main runs the pushed commit. Public callers pin these
# files at main or at the floating major tag, so this run is what checks the
# published contract before a tag moves.
#
# Jobs that need the LLM router or the GitHub App run only when those secrets
# are present. Otherwise the `preflight` job prints a notice and the fixture is
# skipped. The Canary summary accepts a skip only for that reason. A failure, a
# cancellation or a 429 from a reusable fails the canary.
#
# The job named `Canary` is the required check. It fails when any fixture fails
# or is cancelled.
#
# The `promote` job at the end runs on push to main after the Canary summary
# succeeds. It moves the floating major tag when a release tag already names
# this commit. When the release comes later, promote-major-tag.yml does it. Both
# paths call scripts/promote-major-tag.sh.

name: Canary

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  preflight:
    name: Check secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      ai: ${{ steps.check.outputs.ai }}
      typesafe: ${{ steps.check.outputs.typesafe }}
    steps:
      - id: check
        env:
          ROUTER_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
          ROUTER_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          APP_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          TYPESAFE_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          ai=false
          if [[ -n "$ROUTER_KEY" && -n "$ROUTER_URL" && -n "$APP_KEY" ]]; then
            ai=true
          fi
          typesafe=false
          if [[ -n "$TYPESAFE_KEY" ]]; then
            typesafe=true
          fi
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "typesafe=$typesafe" >> "$GITHUB_OUTPUT"
          if [[ "$ai" != true ]]; then
            echo "::notice::LLM router or GitHub App secrets are not available to this run; AI fixtures are skipped."
          fi
          if [[ "$typesafe" != true ]]; then
            echo "::notice::TYPESAFE_API_KEY is not available to this run; the scope-classify fixture is skipped."
          fi

  # Fixtures without secrets. Each runs on every PR and every push to main.
  ai-merge-gate:
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/_ai-merge-gate.yml

  copilot-setup-steps:
    permissions:
      contents: read
    uses: ./.github/workflows/_copilot-setup-steps.yml

  ci-fail-issue:
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/ci-fail-issue.yml

  # Fixtures that need the LLM router and GitHub App secrets. `dry_run` is set
  # where the reusable offers it, so the fixture reads and decides without
  # pushing or replying.
  best-practices:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/best-practices.yml
    secrets: inherit

  cc-ci-fix:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/cc-ci-fix.yml
    with:
      ci_structure: "test.yml (bun test for JavaScript scripts)"
      dry_run: true
    secrets: inherit

  cc-code-simplifier:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/cc-code-simplifier.yml
    secrets: inherit

  cc-dep-review:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/cc-dep-review.yml
    secrets: inherit

  cc-issue-resolver:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/cc-issue-resolver.yml
    secrets: inherit

  cc-next-steps:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/cc-next-steps.yml
    secrets: inherit

  cc-post-merge-docs-review:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/cc-post-merge-docs-review.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets: inherit

  cc-post-merge-tests:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/cc-post-merge-tests.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets: inherit

  cc-pr-review-responder:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/cc-pr-review-responder.yml
    with:
      dry_run: true
    secrets: inherit

  cc-release-notes:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/cc-release-notes.yml
    secrets: inherit

  issue-backlog-sweep:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/issue-backlog-sweep.yml
    secrets: inherit

  issue-hygiene:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/issue-hygiene.yml
    secrets: inherit

  issue-sweeper:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/issue-sweeper.yml
    secrets: inherit

  issue-triage:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/issue-triage.yml
    secrets: inherit

  policy-gate:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions: {}
    uses: ./.github/workflows/policy-gate.yml
    secrets: inherit

  pr-agent:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-agent.yml
    secrets: inherit

  review-thread-resolver:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/review-thread-resolver.yml
    secrets: inherit

  suite-ci:
    needs: preflight
    if: ${{ needs.preflight.outputs.ai == 'true' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/suite-ci.yml
    with:
      repo_context: "Reusable GitHub Actions workflows for AI-powered CI/CD automation (prompts, scripts, YAML workflows)"
      ci_structure: "test.yml (bun test for JavaScript scripts)"
      workflow_name: "Tests"
    secrets: inherit

  scope-classify:
    needs: preflight
    if: ${{ needs.preflight.outputs.typesafe == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/scope-classify.yml
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  canary-summary:
    name: Canary
    needs:
      - preflight
      - ai-merge-gate
      - copilot-setup-steps
      - ci-fail-issue
      - best-practices
      - cc-ci-fix
      - cc-code-simplifier
      - cc-dep-review
      - cc-issue-resolver
      - cc-next-steps
      - cc-post-merge-docs-review
      - cc-post-merge-tests
      - cc-pr-review-responder
      - cc-release-notes
      - issue-backlog-sweep
      - issue-hygiene
      - issue-sweeper
      - issue-triage
      - policy-gate
      - pr-agent
      - review-thread-resolver
      - suite-ci
      - scope-classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every fixture to pass; skip only without its secrets
        env:
          R_PREFLIGHT: ${{ needs.preflight.result }}
          AI: ${{ needs.preflight.outputs.ai }}
          TYPESAFE: ${{ needs.preflight.outputs.typesafe }}
          R_AI_MERGE_GATE: ${{ needs.ai-merge-gate.result }}
          R_COPILOT_SETUP_STEPS: ${{ needs.copilot-setup-steps.result }}
          R_CI_FAIL_ISSUE: ${{ needs.ci-fail-issue.result }}
          R_BEST_PRACTICES: ${{ needs.best-practices.result }}
          R_CC_CI_FIX: ${{ needs.cc-ci-fix.result }}
          R_CC_CODE_SIMPLIFIER: ${{ needs.cc-code-simplifier.result }}
          R_CC_DEP_REVIEW: ${{ needs.cc-dep-review.result }}
          R_CC_ISSUE_RESOLVER: ${{ needs.cc-issue-resolver.result }}
          R_CC_NEXT_STEPS: ${{ needs.cc-next-steps.result }}
          R_CC_POST_MERGE_DOCS_REVIEW: ${{ needs.cc-post-merge-docs-review.result }}
          R_CC_POST_MERGE_TESTS: ${{ needs.cc-post-merge-tests.result }}
          R_CC_PR_REVIEW_RESPONDER: ${{ needs.cc-pr-review-responder.result }}
          R_CC_RELEASE_NOTES: ${{ needs.cc-release-notes.result }}
          R_ISSUE_BACKLOG_SWEEP: ${{ needs.issue-backlog-sweep.result }}
          R_ISSUE_HYGIENE: ${{ needs.issue-hygiene.result }}
          R_ISSUE_SWEEPER: ${{ needs.issue-sweeper.result }}
          R_ISSUE_TRIAGE: ${{ needs.issue-triage.result }}
          R_POLICY_GATE: ${{ needs.policy-gate.result }}
          R_PR_AGENT: ${{ needs.pr-agent.result }}
          R_REVIEW_THREAD_RESOLVER: ${{ needs.review-thread-resolver.result }}
          R_SUITE_CI: ${{ needs.suite-ci.result }}
          R_SCOPE_CLASSIFY: ${{ needs.scope-classify.result }}
        run: |
          fail=0
          check() {
            local name="$1" result="$2" enabled="$3"
            if [[ "$result" == success ]]; then
              echo "$name: success"
            elif [[ "$result" == skipped && "$enabled" == false ]]; then
              echo "::notice::$name: skipped because its secrets are not available to this run"
            else
              echo "::error::$name result is '$result' (secrets available: $enabled)"
              fail=1
            fi
          }
          check preflight "$R_PREFLIGHT" true
          check ai-merge-gate "$R_AI_MERGE_GATE" true
          check copilot-setup-steps "$R_COPILOT_SETUP_STEPS" true
          check ci-fail-issue "$R_CI_FAIL_ISSUE" true
          check best-practices "$R_BEST_PRACTICES" "$AI"
          check cc-ci-fix "$R_CC_CI_FIX" "$AI"
          check cc-code-simplifier "$R_CC_CODE_SIMPLIFIER" "$AI"
          check cc-dep-review "$R_CC_DEP_REVIEW" "$AI"
          check cc-issue-resolver "$R_CC_ISSUE_RESOLVER" "$AI"
          check cc-next-steps "$R_CC_NEXT_STEPS" "$AI"
          check cc-post-merge-docs-review "$R_CC_POST_MERGE_DOCS_REVIEW" "$AI"
          check cc-post-merge-tests "$R_CC_POST_MERGE_TESTS" "$AI"
          check cc-pr-review-responder "$R_CC_PR_REVIEW_RESPONDER" "$AI"
          check cc-release-notes "$R_CC_RELEASE_NOTES" "$AI"
          check issue-backlog-sweep "$R_ISSUE_BACKLOG_SWEEP" "$AI"
          check issue-hygiene "$R_ISSUE_HYGIENE" "$AI"
          check issue-sweeper "$R_ISSUE_SWEEPER" "$AI"
          check issue-triage "$R_ISSUE_TRIAGE" "$AI"
          check policy-gate "$R_POLICY_GATE" "$AI"
          check pr-agent "$R_PR_AGENT" "$AI"
          check review-thread-resolver "$R_REVIEW_THREAD_RESOLVER" "$AI"
          check suite-ci "$R_SUITE_CI" "$AI"
          check scope-classify "$R_SCOPE_CLASSIFY" "$TYPESAFE"
          exit "$fail"

  # Second arrival for a release: this push-to-main run finished after the release
  # tag named this commit. `needs` with `success()` means the summary above already
  # concluded success, so the script skips the check-run lookup.
  promote:
    name: Move floating major tag
    needs: [canary-summary]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    concurrency:
      group: promote-major-tag
      cancel-in-progress: false
    steps:
      - name: Check out tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Promote if a release tag names this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/promote-major-tag.sh "$SHA" --gate-verified
