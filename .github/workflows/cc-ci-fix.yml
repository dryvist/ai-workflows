# CI Failure Auto-Fix
#
# Reusable workflow: called by consumer repos when CI fails on a PR branch.
# Analyzes failure logs and pushes fixes (max 2 attempts per PR).
#
# Security: The fix job includes a fork guard to prevent untrusted code checkout
# in the privileged workflow_run context (CodeQL actions/untrusted-checkout/high).

name: cc-CI Fix

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      daily_run_limit:
        description: "Max workflow runs per day (0 to disable)"
        type: string
        default: "5"
      repo_context:
        description: >-
          Brief description of the repository. Optional — defaults to the
          repo's own GitHub description (github.event.repository.description).
        type: string
        required: false
        default: ""
      ci_structure:
        description: "Description of CI workflows and what they check"
        type: string
        required: true
      extra_tools:
        description: "Additional allowed tools beyond defaults (e.g., Bash(tofu:*))"
        type: string
        default: ""
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-fix-${{ github.repository }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  should-fix:
    name: Check if fix needed
    # Gate on CI failure (or manual dispatch) so direct importers no-op on green
    # builds. suite-ci applies the same conclusion gate one level up.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'copilot[bot]'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
      issues: read
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      should_run: ${{ steps.check-attempts.outputs.should_run }}
      attempt: ${{ steps.check-attempts.outputs.attempt }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Find associated PR
        id: find-pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/find-pr.js');
            await run({ github, context, core });

      - name: Check attempt count
        id: check-attempts
        if: steps.find-pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/check-attempts.js');
            await run({ github, context, core });

  check-daily-limit:
    name: Check daily run limit
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check daily run limit
        id: check
        uses: actions/github-script@v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  post-attempt-comment:
    name: Post attempt marker
    needs: [should-fix, check-daily-limit]
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.should-fix.outputs.should_run == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Post tracking comment
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.should-fix.outputs.pr_number }}
          ATTEMPT: ${{ needs.should-fix.outputs.attempt }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/post-attempt-comment.js');
            await run({ github, context, core });

  get-failure-details:
    name: Get failure logs
    needs: [should-fix, check-daily-limit]
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.should-fix.outputs.should_run == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      actions: read
    outputs:
      failure_logs: ${{ steps.get-logs.outputs.logs }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Download failure logs
        id: get-logs
        uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/get-failure-logs.js');
            await run({ github, context, core });

  fix:
    name: Claude Fix
    needs: [should-fix, get-failure-details, post-attempt-comment, check-daily-limit]
    # Security: fork guard — only checkout branches from the same repository, never forks
    # Also require upstream gate jobs to have passed (explicit `if` replaces the default
    # dependency-success check, so all conditions must be listed here).
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.should-fix.outputs.should_run == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    timeout-minutes: 15
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Checkout ai-workflows prompts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: |
            .github/scripts
            .github/prompts
          path: .ai-workflows

      - name: Render prompt
        id: prompt
        env:
          REPO_CONTEXT: ${{ inputs.repo_context || github.event.repository.description }}
          CI_STRUCTURE: ${{ inputs.ci_structure }}
          FAILURE_LOGS: ${{ needs.get-failure-details.outputs.failure_logs }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-workflows/.github/prompts/ci-fix.md FAILURE_LOGS REPO_CONTEXT CI_STRUCTURE

      # Claude only EDITS files (use_commit_signing: false) — claude-code-action's
      # own commit path can't target a PR branch from a workflow_run trigger (no
      # PR context in the event payload), so the edits stay in the working tree
      # and the "Commit fix" step below commits them to the known PR branch.
      - name: Run Claude Code
        uses: dryvist/ai-workflows/.github/actions/run-claude-code@main
        with:
          prompt: ${{ steps.prompt.outputs.content }}
          model: ${{ vars.GH_ACTION_AI_MODEL_CODE || vars.GH_ACTION_AI_MODEL }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*)${{ inputs.extra_tools != '' && format(',{0}', inputs.extra_tools) || '' }}"
          claude_code_oauth_token: ${{ secrets.GH_ACTION_AI_API_KEY }}
          use_commit_signing: "false"
          allowed_bots: "github-actions,claude"

      # Mint an App token so the commit is authored by JacobPEvans-claude[bot] and
      # GitHub-VERIFIED (createCommitOnBranch web-flow), satisfying
      # required_signatures rulesets and re-triggering CI on the PR.
      - name: Mint commit token
        id: commit-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

      - name: Commit fix to PR branch
        uses: actions/github-script@v9
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_MESSAGE: "fix: resolve CI failure (auto-fix attempt ${{ needs.should-fix.outputs.attempt }})"
        with:
          github-token: ${{ steps.commit-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/commit-fix.js');
            await run({ github, context, core });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ needs.should-fix.outputs.pr_number }};
            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `> **CI fix failed.** Workflow timed out or encountered an error.\n> [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n> This PR may need manual CI fixes.`
            });
