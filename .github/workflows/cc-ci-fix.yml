# CI Failure Auto-Fix
#
# Reusable workflow: called by consumer repos when CI fails on a PR branch.
# Analyzes failure logs and pushes fixes (max 2 attempts per PR).
#
# Security: The fix job includes a fork guard before checking out the failed
# branch, regardless of whether the caller uses workflow_run or workflow_call.

name: cc-CI Fix

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      daily_run_limit:
        description: "Maximum workflow runs per day"
        type: string
        default: "5"
      local_only:
        description: Route every model request through the local-only router role.
        type: boolean
        required: false
        default: false
      local_model:
        description: Existing router role to use when local_only is true.
        type: string
        required: false
        default: ""
      dry_run:
        description: Generate an artifact without publishing a patch or failure reply.
        type: boolean
        required: false
        default: false
      repo_context:
        description: >-
          Brief description of the repository. Optional — defaults to the
          repo's own GitHub description (github.event.repository.description).
        type: string
        required: false
        default: ""
      ci_structure:
        description: "Description of CI workflows and what they check"
        type: string
        required: true
      extra_tools:
        description: "Additional allowed tools beyond defaults (e.g., Bash(tofu:*))"
        type: string
        default: ""
      failure_conclusion:
        description: "Conclusion of the CI run being handled"
        type: string
        default: ""
      failure_run_id:
        description: "ID of the CI run being handled"
        type: string
        default: ""
      failure_head_branch:
        description: "Head branch of the failed CI run"
        type: string
        default: ""
      failure_head_repository:
        description: "Full name of the repository containing the failed head"
        type: string
        default: ""
      failure_actor:
        description: "Actor that started the failed CI run"
        type: string
        default: ""
    secrets:
      LLM_ROUTER_BASE_URL:
        required: true
      LLM_ROUTER_API_KEY:
        required: false
      OPENBAO_ADDR:
        description: OpenBao service URL used by the local-only OIDC identity.
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        required: false
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-fix-${{ github.repository }}-${{ inputs.failure_head_branch || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  should-fix:
    name: Check if fix needed
    # Gate on CI failure so direct importers no-op on green builds. suite-ci
    # applies the same conclusion gate one level up.
    if: >-
      (inputs.failure_conclusion || github.event.workflow_run.conclusion) == 'failure' &&
      (inputs.failure_actor || github.actor) != 'renovate[bot]' &&
      (inputs.failure_actor || github.actor) != 'dependabot[bot]' &&
      (inputs.failure_actor || github.actor) != 'copilot[bot]'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: read
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      should_run: ${{ steps.check-attempts.outputs.should_run }}
      attempt: ${{ steps.check-attempts.outputs.attempt }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Find associated PR
        id: find-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FAILURE_HEAD_BRANCH: ${{ inputs.failure_head_branch || github.event.workflow_run.head_branch }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/find-pr.js');
            await run({ github, context, core });

      - name: Check attempt count
        id: check-attempts
        if: steps.find-pr.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/check-attempts.js');
            await run({ github, context, core });

  check-daily-limit:
    name: Check daily run limit
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check daily run limit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  post-attempt-comment:
    name: Post attempt marker
    needs: [should-fix, check-daily-limit]
    if: >-
      (github.event.workflow_run.head_repository.full_name || inputs.failure_head_repository) == github.repository &&
      needs.should-fix.outputs.should_run == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Post tracking comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.should-fix.outputs.pr_number }}
          ATTEMPT: ${{ needs.should-fix.outputs.attempt }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/post-attempt-comment.js');
            await run({ github, context, core });

  get-failure-details:
    name: Get failure logs
    needs: [should-fix, check-daily-limit]
    if: >-
      (github.event.workflow_run.head_repository.full_name || inputs.failure_head_repository) == github.repository &&
      needs.should-fix.outputs.should_run == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      failure_logs: ${{ steps.get-logs.outputs.logs }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Download failure logs
        id: get-logs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FAILURE_RUN_ID: ${{ inputs.failure_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/get-failure-logs.js');
            await run({ github, context, core });

  fix:
    name: AI Fix
    needs: [should-fix, get-failure-details, post-attempt-comment, check-daily-limit]
    # Security: fork guard — only checkout branches from the same repository, never forks
    # Also require upstream gate jobs to have passed (explicit `if` replaces the default
    # dependency-success check, so all conditions must be listed here).
    if: >-
      (github.event.workflow_run.head_repository.full_name || inputs.failure_head_repository) == github.repository &&
      needs.should-fix.outputs.should_run == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    # No id-token grant: callers grant only the standard set, and a reusable job
    # that requests more fails at startup for every caller. local_only's OpenBao
    # OIDC step therefore cannot mint a token from this job and fails closed.
    # checks: write posts the neutral check run when the agent hits a gateway failure.
    permissions:
      checks: write
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.failure_head_branch || github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ai-workflows prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-ci-fix.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          REPO_CONTEXT: ${{ inputs.repo_context || github.event.repository.description }}
          CI_STRUCTURE: ${{ inputs.ci_structure }}
          FAILURE_LOGS: ${{ needs.get-failure-details.outputs.failure_logs }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-ci-fix.md FAILURE_LOGS REPO_CONTEXT CI_STRUCTURE

      - name: Validate local model flow configuration
        if: inputs.local_only
        env:
          LOCAL_MODEL: ${{ inputs.local_model }}
          LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          OTEL_ENDPOINT: ${{ vars.AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
        run: |
          test -n "$LOCAL_MODEL" || { echo "local_model is required when local_only is true" >&2; exit 1; }
          test -n "$LLM_ROUTER_BASE_URL" || { echo "LLM_ROUTER_BASE_URL is required when local_only is true" >&2; exit 1; }
          test -n "$OPENBAO_ADDR" || { echo "OPENBAO_ADDR is required when local_only is true" >&2; exit 1; }
          test -n "$OTEL_ENDPOINT" || { echo "AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT is required when local_only is true" >&2; exit 1; }
          case "$DAILY_RUN_LIMIT" in ''|*[!0-9]*|0) echo "daily_run_limit must be positive" >&2; exit 1 ;; esac

      - name: Read CI-fix router key through OpenBao OIDC
        id: router-key
        if: inputs.local_only
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
        with:
          url: ${{ secrets.OPENBAO_ADDR }}
          method: jwt
          path: github-actions
          role: github-agent-ci-fix
          jwtGithubAudience: https://github.com/dryvist
          exportEnv: false
          exportToken: false
          secrets: |
            secret/data/apps/github-actions-ci-fix github_actions_ci_fix_llm_router_key | LLM_ROUTER_API_KEY

      # Claude only EDITS files (use_commit_signing: false) — claude-code-action's
      # own commit path can't target a PR branch from a workflow_run trigger (no
      # PR context in the event payload), so the edits stay in the working tree
      # and the "Commit fix" step below commits them to the known PR branch.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ inputs.local_only && 'claude' || vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ inputs.local_only && inputs.local_model || vars.GH_ACTION_AI_MODEL_CODE || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*)${{ inputs.extra_tools != '' && format(',{0}', inputs.extra_tools) || '' }}"
          permission_profile: workspace
          base_url: ${{ secrets.LLM_ROUTER_BASE_URL }}
          api_key: ${{ inputs.local_only && steps.router-key.outputs.LLM_ROUTER_API_KEY || secrets.LLM_ROUTER_API_KEY }}
          litellm_tags: ${{ inputs.local_only && 'agent-flow:ci-failure-fixer,agent-trigger:workflow_run' || '' }}
          otel_traces_endpoint: ${{ inputs.local_only && vars.AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || '' }}
          otel_resource_attributes: ${{ inputs.local_only && 'langfuse.environment=production,service.name=ci-failure-fixer,agent.flow=ci-failure-fixer,agent.trigger=workflow_run' || '' }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions,claude,jacobpevans-claude"

      - name: Collect agent patch
        run: |
          git add -N -A
          git reset -q -- .ai-workflows
          git diff --binary HEAD > agent.patch

      - name: Upload agent patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-fix-${{ github.run_id }}
          path: agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish CI fix
    needs: [should-fix, fix]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.failure_head_branch || github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download agent patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-fix-${{ github.run_id }}

      - name: Apply agent patch
        run: |
          if [ -s agent.patch ]; then
            git apply agent.patch
          fi
          rm agent.patch

      # The fresh publisher alone receives the App token.
      - name: Mint commit token
        id: commit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit fix to PR branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_BRANCH: ${{ inputs.failure_head_branch || github.event.workflow_run.head_branch }}
          COMMIT_MESSAGE: "fix: resolve CI failure (auto-fix attempt ${{ needs.should-fix.outputs.attempt }})"
        with:
          github-token: ${{ steps.commit-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/commit-fix.js');
            await run({ github, context, core });

  notify-failure:
    name: Report CI fix failure
    needs: [should-fix, fix, publish]
    if: failure() && !inputs.dry_run
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Comment on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.should-fix.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `> **CI fix failed.** Workflow timed out or encountered an error.\n> [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n> This PR may need manual CI fixes.`
            });
