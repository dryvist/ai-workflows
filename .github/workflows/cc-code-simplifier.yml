# Code Simplifier
#
# Simplifies recently modified code for clarity, consistency, and maintainability while
# preserving exact functionality.
#
# Two providers:
#   claude (default) - an agent edits the tree and a focused PR is opened.
#   router           - a cheap/local model served through a self-hosted
#                      OpenAI-compatible router reads the pull request diff and
#                      posts ONE sticky advisory comment. It never edits a file
#                      and never pushes. Router or model failures post
#                      "simplifier unavailable: <reason>" and the job still
#                      succeeds. Never make the router job a required check.
#
# This is a reusable workflow that can be called from other repositories.

name: cc-Code Simplifier

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      daily_run_limit:
        description: "Max workflow runs per day (0 to disable)"
        type: string
        default: "5"
      provider:
        description: >-
          claude (default) runs the editing agent and opens a PR. router runs a
          read-only first pass on the router and posts a sticky advisory comment.
        type: string
        required: false
        default: claude
      model:
        description: >-
          Router ROLE alias to call in router mode (e.g. subagent, cheap).
          Always an alias the router resolves - never a vendor model id.
        type: string
        required: false
        default: subagent
      max_diff_kb:
        description: "Truncate the diff sent to the model at this many KiB"
        type: number
        required: false
        default: 200
      max_tokens:
        description: "Completion token ceiling for the router call"
        type: number
        required: false
        default: 1500
      base_url_var_name:
        description: >-
          Name of the Actions variable holding the router's OpenAI-compatible
          /v1 base URL. Defaults to LLM_ROUTER_BASE_URL.
        type: string
        required: false
        default: LLM_ROUTER_BASE_URL
    secrets:
      # Declaring any secret ends the implicit "inherit is the only contract"
      # state, so the claude-mode secrets are declared too - all optional, so a
      # caller using `secrets: inherit` is unaffected.
      GH_ACTION_AI_API_KEY:
        description: "Anthropic API key for the claude-mode agent"
        required: false
      OPENAI_API_KEY:
        description: "OpenAI API key for the claude-mode agent's codex backend"
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        description: "Private key of the App that opens the claude-mode PR"
        required: false
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router virtual key (never the router master key). When absent
          router mode posts "simplifier unavailable" and succeeds.
        required: false
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: code-simplifier-${{ github.repository }}-${{ github.event.pull_request.number || 'repo-wide' }}
  cancel-in-progress: false

jobs:
  check-pr-ceiling:
    name: Check bot PR ceiling
    if: inputs.provider != 'router'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check bot PR ceiling
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-pr-ceiling.js');
            await run({ github, context, core });

  check-daily-limit:
    name: Check daily run limit
    if: inputs.provider != 'router'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    # No actions:read requirement — the check fails open if it cannot list runs,
    # so callers need not grant actions:read (which they omit and startup-fail on).
    permissions: {}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check daily run limit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  simplify:
    needs: [check-pr-ceiling, check-daily-limit]
    if: >-
      inputs.provider != 'router' &&
      needs.check-pr-ceiling.outputs.allowed == 'true' &&
      needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-code-simplifier.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-code-simplifier.md

      # Verified Commit & PR Pattern (docs/PATTERNS.md): Claude only edits + writes its
      # PR description to .claude-pr.md; the steps below open a VERIFIED PR from it.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ vars.GH_ACTION_AI_MODEL_CODE || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh search:*)"
          permission_profile: workspace
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}

      - name: Collect agent patch
        run: |
          git add -N -A
          git reset -q -- .ai-workflows
          git diff --binary HEAD > agent.patch

      - name: Upload agent patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-simplifier-${{ github.run_id }}
          path: agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish simplification PR
    needs: simplify
    if: inputs.provider != 'router'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download agent patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-simplifier-${{ github.run_id }}

      - name: Apply agent patch
        run: |
          if [ -s agent.patch ]; then
            git apply agent.patch
          fi
          rm agent.patch

      - name: Mint PR token
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_BRANCH: claude/code-simplifier-${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.pr-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/pr-from-file.js');
            await run({ github, context, core });

  router-review:
    name: Router simplification review
    if: >-
      inputs.provider == 'router' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Collect diff and changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        run: bash .ai-workflows/.github/scripts/code-simplifier/collect.sh

      - name: Request simplification findings
        env:
          BASE_URL: ${{ vars[inputs.base_url_var_name] }}
          API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          REPO: ${{ github.repository }}
        run: bash .ai-workflows/.github/scripts/code-simplifier/request.sh

      - name: Render comment body
        env:
          MODEL: ${{ inputs.model }}
        run: bash .ai-workflows/.github/scripts/code-simplifier/render.sh

      - name: Post sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BODY_FILE: .code-simplifier.md
          MARKER_MATCH: "<!-- code-simplifier -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/sticky-comment.js');
            await run({ github, context, core });

      - name: Job summary
        run: cat .code-simplifier.md >> "$GITHUB_STEP_SUMMARY"
