# CC Dep Review — supply-chain defense in depth for dependency-bot PRs.
#
# The INVERSE of Layer 3 (docs/PATTERNS.md → "Dependency bot filtering"): every
# other AI workflow SKIPS renovate/dependabot PRs; this one runs ONLY on them.
# It runs on EVERY Renovate/Dependabot PR (not a trust-tier subset), reported
# under the separate AI Merge Gate. Renovate owns all merging under the org
# dependency-freshness model (dryvist/.github → SECURITY.md → Dependency
# Trust): minor/patch auto-merges publisher-agnostically after a 3-day soak +
# green CI; majors open for review. This workflow NEVER merges: it is a
# deterministic native gate plus an advisory AI signal.
#
# Defense in depth, two layers. The DETERMINISTIC native gate is authoritative;
# the AI is one added signal that CANNOT override it:
#   1. native-gate — actions/dependency-review-action fails closed on vulnerable
#      or disallowed dependencies, including transitive/lockfile changes. The AI
#      has no influence over this job.
#   2. review — Claude assesses risk with an injection-resistant prompt (treats
#      all package-supplied text as hostile data), applies exactly one
#      risk:low|medium|high label, and writes an advisory that a workflow step
#      posts as ONE sticky comment. Claude never merges, approves, commits, or
#      posts the comment itself.
#
# Cost bounds are structural: consumer callers trigger on `pull_request: [opened]`
# only, check-eligibility skips digest pins / lock-file maintenance / out-of-scope
# bump types, and a dedup marker guarantees at most one Claude run per PR. No
# check-daily-limit job (actions:read under cross-repo workflow_call causes
# startup_failure — see issue-backlog-sweep history).

name: CC Dep Review

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest.
        type: string
        required: false
        default: ubuntu-latest
      model:
        description: "Selected provider model override"
        type: string
        default: ""
      update_types:
        description: "Comma-separated Renovate update types to review"
        type: string
        default: "major,minor"
      require_label:
        description: "Only review PRs carrying this label (empty = no label gate)"
        type: string
        default: ""
      bot_authors:
        description: "Comma-separated bot logins whose PRs are reviewed"
        type: string
        default: "renovate[bot]"
      fail_on_severity:
        description: >-
          dependency-review-action severity threshold that fails the native gate
          (low | moderate | high | critical).
        type: string
        required: false
        default: moderate
    secrets:
      GH_ACTION_AI_API_KEY:
        description: "Anthropic API key; required when GH_ACTION_AI_AGENT is claude"
        required: false
      OPENAI_API_KEY:
        description: "OpenAI API key; required when GH_ACTION_AI_AGENT is codex"
        required: false

# Reusable-workflow ceiling. This workflow never merges or pushes commits, so
# no job needs contents: write; every job narrows further below.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cc-dep-review-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  check-eligibility:
    name: Check eligibility
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      update_type: ${{ steps.check.outputs.update_type }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check eligibility
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          UPDATE_TYPES: ${{ inputs.update_types }}
          REQUIRE_LABEL: ${{ inputs.require_label }}
          BOT_AUTHORS: ${{ inputs.bot_authors }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/dep-review/check-eligibility.js');
            await run({ github, context, core });

  # Deterministic, AI-independent gate. Fails closed on vulnerable/disallowed
  # deps (incl. transitive + lockfile). Its check status is authoritative; the
  # AI review below cannot override it.
  native-gate:
    name: Native gate (dependency review)
    needs: check-eligibility
    if: needs.check-eligibility.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: GitHub Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail_on_severity }}
          comment-summary-in-pr: on-failure

  review:
    name: Review dependency update
    needs: check-eligibility
    if: needs.check-eligibility.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-dep-review.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
          UPDATE_TYPE: ${{ needs.check-eligibility.outputs.update_type }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-dep-review.md PR_NUMBER UPDATE_TYPE

      # The reviewer writes only local handoff files. A fresh publisher job owns
      # all GitHub mutations.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ inputs.model || vars.GH_ACTION_AI_MODEL_REVIEW || vars.GH_ACTION_AI_MODEL_CODE || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ inputs.model || vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Read,Glob,Grep,LS,Write,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api repos/*),WebFetch(domain:github.com)"
          permission_profile: workspace
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions,renovate,dependabot"

      - name: Upload review handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review-${{ github.run_id }}
          path: |
            .claude-dep-review.md
            .dep-review-risk.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish dependency review
    needs: [check-eligibility, review]
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download review handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-review-${{ github.run_id }}

      - name: Apply risk label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/dep-review/apply-risk-label.js');
            await run({ github, context, core });

      - name: Post review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BODY_FILE: .claude-dep-review.md
          MARKER_MATCH: "<!-- cc-dep-review -->"
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/sticky-comment.js');
            await run({ github, context, core });
