# Issue Auto-Resolver (Claude)
#
# Reusable workflow: called by consumer repos after issue-triage.yml.
# Runs eligibility gates, then uses Claude to create a PR fixing the issue.
# Claude handles its own issue comments (start marker, PR link, abort notice).

name: cc-Issue Resolver

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      repo_context:
        description: >-
          Brief description of the repository for Claude's context. Optional —
          defaults to the repo's GitHub description (github.event.repository.description).
        type: string
        required: false
        default: ""
      extra_tools:
        description: "Additional allowed tools beyond defaults (e.g., Bash(tofu:*))"
        type: string
        default: ""
      model:
        description: "Selected provider model override"
        type: string
        default: ""
      excluded_labels:
        description: "Comma-separated labels that block auto-resolution"
        type: string
        default: "type:security,type:feature,type:breaking"
      max_attempts:
        description: "Max resolution attempts per issue"
        type: string
        default: "1"
      issue_number:
        description: "Issue number to resolve (overrides event payload; enables manual dispatch)"
        type: string
        default: "0"
      allowed_authors:
        description: "Comma-separated author_association values allowed to trigger resolution"
        type: string
        default: "OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR"
      daily_limit:
        description: "Max resolver runs per repo per 24h (0 = disabled)"
        type: string
        default: "5"

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-resolver-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  eligibility-check:
    name: Check eligibility
    runs-on: ${{ inputs.runner_label }}
    permissions:
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      issue_number: ${{ steps.check.outputs.issue_number }}
      issue_title: ${{ steps.check.outputs.issue_title }}
      issue_body: ${{ steps.check.outputs.issue_body }}
      issue_labels: ${{ steps.check.outputs.issue_labels }}
      attempt: ${{ steps.check.outputs.attempt }}
      max_attempts: ${{ inputs.max_attempts }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check eligibility
        id: check
        env:
          EXCLUDED_LABELS: ${{ inputs.excluded_labels }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ALLOWED_AUTHORS: ${{ inputs.allowed_authors }}
          DAILY_LIMIT: ${{ inputs.daily_limit }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/issue-resolver/check-eligibility.js');
            await run({ github, context, core });

  resolve:
    name: AI Resolve
    needs: eligibility-check
    if: needs.eligibility-check.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 15
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: |
            .github/scripts
            .github/prompts
          path: .ai-workflows
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          REPO_CONTEXT: ${{ inputs.repo_context || github.event.repository.description }}
          ISSUE_NUMBER: ${{ needs.eligibility-check.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.eligibility-check.outputs.issue_title }}
          ISSUE_BODY: ${{ needs.eligibility-check.outputs.issue_body }}
          ISSUE_LABELS: ${{ needs.eligibility-check.outputs.issue_labels }}
          ATTEMPT: ${{ needs.eligibility-check.outputs.attempt }}
          MAX_ATTEMPTS: ${{ needs.eligibility-check.outputs.max_attempts }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-workflows/.github/prompts/issue-resolver.md REPO_CONTEXT ISSUE_NUMBER ISSUE_TITLE ISSUE_BODY ISSUE_LABELS ATTEMPT MAX_ATTEMPTS WORKFLOW_NAME RUN_ID RUN_URL EVENT_NAME TRIGGER_ACTOR

      # Claude only EDITS files (use_commit_signing: false). An `issues` event gives
      # claude-code-action no reliable, signature-satisfying way to land a branch + PR
      # itself, so the "Open PR" step below creates the branch + verified commit + PR.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ inputs.model || vars.GH_ACTION_AI_MODEL_PLAN || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ inputs.model || vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*)${{ inputs.extra_tools != '' && format(',{0}', inputs.extra_tools) || '' }}"
          permission_profile: workspace
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}

      - name: Collect agent patch
        run: |
          git add -N -A
          git reset -q -- .ai-workflows
          git diff --binary HEAD > agent.patch

      - name: Upload agent patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-resolver-${{ github.run_id }}
          path: agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish resolution PR
    needs: [eligibility-check, resolve]
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download agent patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-resolver-${{ github.run_id }}

      - name: Apply agent patch
        run: |
          if [ -s agent.patch ]; then
            git apply agent.patch
          fi
          rm agent.patch

      # Mint an App token so the branch commit is GitHub-VERIFIED.
      - name: Mint PR token
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ needs.eligibility-check.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.eligibility-check.outputs.issue_title }}
          ISSUE_LABELS: ${{ needs.eligibility-check.outputs.issue_labels }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.pr-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/issue-resolver/open-pr.js');
            await run({ github, context, core });

  notify-failure:
    name: Report resolution failure
    needs: [eligibility-check, resolve, publish]
    if: failure()
    runs-on: ${{ inputs.runner_label }}
    permissions:
      issues: write
    steps:
      - name: Comment on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ needs.eligibility-check.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!issueNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `> **Auto-resolution failed.** Workflow timed out or encountered an error.\n> [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n> This issue needs manual resolution.`
            });
