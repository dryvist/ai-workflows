# Next Steps
#
# Daily momentum analyzer. Detects development direction from recent merges and suggests
# the logical next action.
#
# This is a reusable workflow that can be called from other repositories.

name: cc-Next Steps

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      daily_run_limit:
        description: "Max workflow runs per day (0 to disable)"
        type: string
        default: "5"
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: next-steps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-pr-ceiling:
    name: Check bot PR ceiling
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check bot PR ceiling
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-pr-ceiling.js');
            await run({ github, context, core });

  check-daily-limit:
    name: Check daily run limit
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    # No actions:read requirement — the check fails open if it cannot list runs,
    # so callers need not grant actions:read (which they omit and startup-fail on).
    permissions: {}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check daily run limit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  analyze:
    needs: [check-pr-ceiling, check-daily-limit]
    if: needs.check-pr-ceiling.outputs.allowed == 'true' && needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: |
            .github/prompts
            .github/scripts
          path: .ai-workflows

      - name: Render prompt
        id: prompt
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-workflows/.github/prompts/next-steps.md

      # Verified Commit & PR Pattern (docs/PATTERNS.md): Claude only edits (and may create an
      # issue for Option B). For Option A it writes .claude-pr.md; the steps below open a
      # VERIFIED PR from it. gh issue:* stays allowed for the issue-creation path.
      - name: Execute Claude Code
        uses: anthropics/claude-code-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1.0.170
        with:
          claude_code_oauth_token: ${{ secrets.GH_ACTION_AI_API_KEY }}
          allowed_bots: "github-actions"
          use_commit_signing: "false"
          prompt: ${{ steps.prompt.outputs.content }}
          claude_args: >-
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*),Bash(gh issue:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh search:*)"
            --model ${{ vars.GH_ACTION_AI_MODEL }}

      - name: Mint PR token
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

      - name: Open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_BRANCH: claude/next-steps-${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.pr-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/pr-from-file.js');
            await run({ github, context, core });
