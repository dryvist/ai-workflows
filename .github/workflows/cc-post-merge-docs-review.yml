# Post-Merge Docs Review
#
# Reusable workflow: reviews documentation after merges for issues.
# Gated by a pre-check for doc-relevant changes.
#
# Security: Uses github.sha and github.repository (both safe, immutable system values)
# passed via env vars to prevent any shell injection risks.

name: cc-Post-Merge Docs Review

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      daily_run_limit:
        description: "Max workflow runs per day (0 to disable)"
        type: string
        default: "5"
      commit_sha:
        description: 'Override commit SHA for workflow_dispatch callers'
        required: false
        type: string
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: post-merge-docs-${{ github.repository }}

jobs:
  check-pr-ceiling:
    name: Check bot PR ceiling
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check bot PR ceiling
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-pr-ceiling.js');
            await run({ github, context, core });

  check-relevance:
    name: Check doc relevance
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      is_relevant: ${{ steps.check.outputs.is_relevant }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check if changes are doc-relevant
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          OVERRIDE_SHA: ${{ inputs.commit_sha || '' }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/post-merge-docs-review/check-docs-relevance.js');
            await run({ github, context, core });

  check-daily-limit:
    name: Check daily run limit
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check daily run limit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  post-merge-docs-review:
    name: Review and fix docs
    needs: [check-pr-ceiling, check-relevance, check-daily-limit]
    if: needs.check-pr-ceiling.outputs.allowed == 'true' && needs.check-relevance.outputs.is_relevant == 'true' && needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-post-merge-docs-review.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          REPO_NAME: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-post-merge-docs-review.md COMMIT_SHA REPO_NAME WORKFLOW_NAME RUN_ID RUN_URL EVENT_NAME TRIGGER_ACTOR

      # Verified Commit & PR Pattern (docs/PATTERNS.md): Claude only edits + writes its
      # PR description to .claude-pr.md; the steps below open a VERIFIED PR from it.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh search:*)"
          permission_profile: workspace
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}

      - name: Collect agent patch
        run: |
          git add -N -A
          git reset -q -- .ai-workflows
          git diff --binary HEAD > agent.patch

      - name: Upload agent patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-merge-docs-${{ github.run_id }}
          path: agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish documentation PR
    needs: post-merge-docs-review
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download agent patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: post-merge-docs-${{ github.run_id }}

      - name: Apply agent patch
        run: |
          if [ -s agent.patch ]; then
            git apply agent.patch
          fi
          rm agent.patch

      - name: Mint PR token
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_BRANCH: claude/post-merge-docs-review-${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.pr-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/pr-from-file.js');
            await run({ github, context, core });
