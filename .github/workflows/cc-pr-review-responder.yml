# cc-PR Review Responder
#
# Reusable workflow: when a reviewer leaves feedback on a PR, Claude evaluates the
# unresolved review threads, edits code to fix the valid points, replies, and
# resolves them — never merges. Delivers the substantive part of a /ship pass.
#
# Near-zero custom code: the trigger is event-driven (consumer callers fire on
# pull_request_review / pull_request_review_comment). Claude only EDITS files and
# drives reply + resolveReviewThread via `gh api graphql` (no native action support
# for thread resolution); a step then commits the edits via the shared
# verified-commit.js (ci-fix/commit-fix.js). Native use_commit_signing is NOT used —
# it does not resolve the PR branch on a review-triggered reusable (logs
# base_branch:"" and commits nothing; proven by E2E, see docs/PATTERNS.md).
#
# Complements the non-AI review-thread-resolver (which clears outdated/failed bot
# threads cheaply); this handles substantive feedback.

name: cc-PR Review Responder

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job on. Defaults to
          ubuntu-latest. Pass a RunsOn label to opt into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      repo_context:
        description: "Brief description of the repository (given to Claude for context)"
        type: string
        required: false
        default: ""
      extra_tools:
        description: "Additional allowed tools beyond defaults (e.g., Bash(tofu:*))"
        type: string
        default: ""
      daily_run_limit:
        description: Maximum workflow runs per day.
        type: string
        required: false
        default: "5"
      local_only:
        description: Route every model request through the local-only router role.
        type: boolean
        required: false
        default: false
      local_model:
        description: Existing router role to use when local_only is true.
        type: string
        required: false
        default: ""
      dry_run:
        description: Generate an artifact without publishing a patch or review response.
        type: boolean
        required: false
        default: false
    secrets:
      LLM_ROUTER_BASE_URL:
        required: true
      LLM_ROUTER_API_KEY:
        required: false
      OPENBAO_ADDR:
        description: OpenBao service URL used by the local-only OIDC identity.
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        description: >-
          JacobPEvans-claude App private key. Mints the App token used for the
          verified commit and for resolving bot-authored threads (the default
          GITHUB_TOKEN usually cannot). Pass it explicitly (preferred,
          zizmor-clean) rather than via secrets: inherit.
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target a single PR (manual/E2E runs, which lack PR event context)"
        type: string
        default: ""

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: pr-review-responder-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  check-daily-limit:
    name: Check daily run limit
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check daily run limit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  respond:
    name: Respond to review feedback
    needs: check-daily-limit
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    # No id-token grant: callers grant only the standard set, and a reusable job
    # that requests more fails at startup for every caller. local_only's OpenBao
    # OIDC step therefore cannot mint a token from this job and fails closed.
    permissions:
      contents: read
      pull-requests: read
    # Fork guard: only same-repo PR heads (never check out a fork with write scope).
    # Loop guard: never act on our own bot's review/comment (its reply is itself a
    # pull_request_review_comment event). workflow_dispatch has no actor/PR to guard,
    # so it is always allowed through for manual/E2E runs.
    if: >-
      needs.check-daily-limit.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.sender.login != 'jacobpevans-claude[bot]' &&
       github.event.sender.login != 'claude[bot]' &&
       github.event.sender.login != 'github-actions[bot]'))
    timeout-minutes: 10
    outputs:
      pr_number: ${{ github.event.pull_request.number || steps.pr.outputs.number }}
      head_sha: ${{ github.event.pull_request.head.sha || steps.pr.outputs.sha }}
      head_ref: ${{ github.event.pull_request.head.ref || steps.pr.outputs.ref }}
    steps:
      # workflow_dispatch has no PR event context — resolve the head SHA (a hex OID,
      # no injection surface) from the trusted integer pr_number input. Review-event
      # runs skip this and use github.event.pull_request.* directly below.
      - name: Resolve PR head (dispatch only)
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          gh pr view "$INPUT_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName \
            --jq '"sha=\(.headRefOid)\nref=\(.headRefName)"' >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ai-workflows prompt and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-pr-review-responder.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Fetch review threads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr.outputs.number }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/pr-review-responder/fetch-threads.js');
            await run({ github, context, core });

      - name: Render prompt
        id: prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr.outputs.number }}
          REPO_CONTEXT: ${{ inputs.repo_context || github.event.repository.description }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-pr-review-responder.md PR_NUMBER REPO_CONTEXT

      - name: Validate local model flow configuration
        if: inputs.local_only
        env:
          LOCAL_MODEL: ${{ inputs.local_model }}
          LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          OTEL_ENDPOINT: ${{ vars.AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
        run: |
          test -n "$LOCAL_MODEL" || { echo "local_model is required when local_only is true" >&2; exit 1; }
          test -n "$LLM_ROUTER_BASE_URL" || { echo "LLM_ROUTER_BASE_URL is required when local_only is true" >&2; exit 1; }
          test -n "$OPENBAO_ADDR" || { echo "OPENBAO_ADDR is required when local_only is true" >&2; exit 1; }
          test -n "$OTEL_ENDPOINT" || { echo "AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT is required when local_only is true" >&2; exit 1; }
          case "$DAILY_RUN_LIMIT" in ''|*[!0-9]*|0) echo "daily_run_limit must be positive" >&2; exit 1 ;; esac

      - name: Read PR-review router key through OpenBao OIDC
        id: router-key
        if: inputs.local_only
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
        with:
          url: ${{ secrets.OPENBAO_ADDR }}
          method: jwt
          path: github-actions
          role: github-agent-pr-review
          jwtGithubAudience: https://github.com/dryvist
          exportEnv: false
          exportToken: false
          secrets: |
            secret/data/apps/github-actions-pr-review github_actions_pr_review_llm_router_key | LLM_ROUTER_API_KEY

      # The model edits files and writes a typed review-action handoff. It never
      # receives the App token used by the fresh publisher job.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ inputs.local_only && 'claude' || vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ inputs.local_only && inputs.local_model || vars.GH_ACTION_AI_MODEL_CODE || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*)${{ inputs.extra_tools != '' && format(',{0}', inputs.extra_tools) || '' }}"
          permission_profile: workspace
          base_url: ${{ secrets.LLM_ROUTER_BASE_URL }}
          api_key: ${{ inputs.local_only && steps.router-key.outputs.LLM_ROUTER_API_KEY || secrets.LLM_ROUTER_API_KEY }}
          litellm_tags: ${{ inputs.local_only && format('agent-flow:pr-review-responder,agent-trigger:{0}', github.event_name) || '' }}
          otel_traces_endpoint: ${{ inputs.local_only && vars.AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || '' }}
          otel_resource_attributes: ${{ inputs.local_only && format('langfuse.environment=production,service.name=pr-review-responder,agent.flow=pr-review-responder,agent.trigger={0}', github.event_name) || '' }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "gemini-code-assist,copilot-pull-request-reviewer,github-actions"

      - name: Collect agent patch
        run: |
          git add -N -A
          git reset -q -- .ai-workflows .review-threads.json .review-actions.json
          git diff --binary HEAD > agent.patch

      - name: Upload responder handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-responder-${{ github.run_id }}
          path: |
            agent.patch
            .review-actions.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish review response
    needs: respond
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.respond.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download responder handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-responder-${{ github.run_id }}

      - name: Apply agent patch
        run: |
          if [ -s agent.patch ]; then
            git apply agent.patch
          fi
          rm agent.patch

      # The fresh publisher alone receives the App token.
      - name: Mint commit token
        id: commit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit fixes to PR branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_BRANCH: ${{ needs.respond.outputs.head_ref }}
          COMMIT_MESSAGE: "fix: address review feedback (AI responder)"
        with:
          github-token: ${{ steps.commit-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/ci-fix/commit-fix.js');
            await run({ github, context, core });

      - name: Reply to review threads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.respond.outputs.pr_number }}
        with:
          github-token: ${{ steps.commit-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/pr-review-responder/publish-actions.js');
            await run({ github, context, core });
