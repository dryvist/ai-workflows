# CC Release Notes
#
# Reusable workflow: Claude reads a release-please PR's changelog delta and
# posts 3-6 human-readable, user-impact highlight bullets as ONE sticky
# comment. It never edits the PR body or branch — release-please force-pushes
# its branch and round-trips its body into the GitHub Release, so a comment is
# the only shape that survives; a human copies highlights into the body if
# wanted (release-please preserves edits between its markers).
#
# Cost bound: the gate embeds the head SHA in the comment marker, so the
# `synchronize` storm from release-please's body refreshes only pays for
# Claude when the head actually moved.

name: CC Release Notes

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label for the highlights job. Defaults to
          self-hosted.
        type: string
        required: false
        default: self-hosted
      model:
        description: "Selected provider model override"
        type: string
        default: ""
      release_bot:
        description: "Login of the release-please App bot authoring release PRs"
        type: string
        default: "jacobpevans-release-please[bot]"
      branch_prefix:
        description: "Head-branch prefix identifying release PRs"
        type: string
        default: "release-please--"
    secrets:
      LLM_ROUTER_BASE_URL:
        required: true
      LLM_ROUTER_API_KEY:
        required: true
      NTFY_BASE_URL:
        description: >-
          Base URL of the ntfy hub that receives one ops alert (topic "ai") when
          the highlights agent is unavailable. Optional: skipped when absent.
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        description: >-
          Private key of the Claude bot App. Mints the token that posts the
          neutral check run when the agent hits the deadline. Without it the
          job fails, and names the missing key.
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cc-release-notes-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  check-eligibility:
    name: Check eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      release_bot_bare: ${{ steps.check.outputs.release_bot_bare }}
    steps:
      - name: Explain fork pull request skip
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Release highlights are skipped for pull requests from forks."

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check eligibility
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_BOT: ${{ inputs.release_bot }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/release-notes/check-eligibility.js');
            await run({ github, context, core });

  highlights:
    name: Write release highlights
    needs: check-eligibility
    if: >-
      needs.check-eligibility.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: >-
      ${{ (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (inputs.runner_label || 'self-hosted') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 8
    outputs:
      neutral: ${{ steps.unavailable.outputs.neutral }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Claude diffs the last tag against HEAD
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/actions/run-ai-agent
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-release-notes.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-release-notes.md PR_NUMBER

      # Bounds what the agent is sent: commits and diff stat since the last tag,
      # capped with a note on truncation. The bounded text is appended to the prompt.
      - name: Bound the release input
        id: bound
        env:
          PROMPT: ${{ steps.prompt.outputs.content }}
        run: bash .ai-workflows/.github/scripts/release-notes/bound-input.sh

      - name: Mark the agent start
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run AI agent
        id: agent
        # Leaves room inside the job's 8-minute cap for the report and publish
        # steps. A step that runs past this bound is a deadline, not a failure.
        timeout-minutes: 6
        uses: ./.ai-workflows/.github/actions/run-ai-agent
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.bound.outputs.content }}
          claude_model: ${{ inputs.model || 'review-local' }}
          codex_model: ${{ inputs.model || vars.GH_ACTION_AI_CODEX_MODEL }}
          allowed_tools: "Read,Glob,Grep,LS,Write,Bash(git log:*),Bash(git diff:*),Bash(git tag:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
          permission_profile: workspace
          base_url: ${{ secrets.LLM_ROUTER_BASE_URL }}
          api_key: ${{ secrets.LLM_ROUTER_API_KEY }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions,${{ needs.check-eligibility.outputs.release_bot_bare }}"
          claude_bot_app_id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          claude_bot_private_key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

      # A gateway, budget or 429 failure, or the 6-minute bound, ends this job
      # neutrally with the summary line and an ops alert. Any other failure fails it.
      # Minted only when the agent did not succeed, for the deadline check run.
      # A failed mint is named by the unavailable step, which then fails.
      - name: Mint the check-run token
        id: check-token
        if: always() && steps.clock.outcome == 'success' && steps.agent.outcome != 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-checks: write

      - name: Report an unavailable agent
        id: unavailable
        if: always() && steps.clock.outcome == 'success' && (steps.agent.outcome != 'success' || steps.agent.outputs.gateway_class != '')
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GATEWAY_CLASS: ${{ steps.agent.outputs.gateway_class }}
          STARTED: ${{ steps.clock.outputs.started }}
          DEADLINE_SECONDS: "360"
          JOB_NAME: ${{ github.workflow }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Advisory: neutral.
          CONCLUSION: neutral
          GITHUB_TOKEN: ${{ steps.check-token.outputs.token }}
          CHECK_TOKEN_CAUSE: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY == '' && 'GH_APP_CLAUDE_BOT_PRIVATE_KEY is not set' || 'the mint step failed' }}
          CHECK_HEAD_SHA: ${{ needs.check-eligibility.outputs.head_sha }}
        run: bash .ai-workflows/.github/scripts/release-notes/agent-unavailable.sh

      - name: Upload release highlights
        if: steps.unavailable.outputs.neutral != 'true' && steps.agent.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-highlights-${{ github.run_id }}
          path: .claude-release-notes.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  report-highlights-failure:
    name: Report release highlights failure
    needs: [check-eligibility, highlights]
    if: >-
      always() &&
      needs.check-eligibility.outputs.should_run == 'true' &&
      (needs.highlights.result == 'failure' || needs.highlights.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Report agent failure
        run: |
          echo "::error::The release highlights job failed or was cancelled before it could publish. Check the Write release highlights job logs."
          exit 1

  publish:
    name: Publish release highlights
    needs: [check-eligibility, highlights]
    if: needs.highlights.result == 'success' && needs.highlights.outputs.neutral != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download release highlights
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-highlights-${{ github.run_id }}

      - name: Post highlights comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BODY_FILE: .claude-release-notes.md
          MARKER_MATCH: "<!-- cc-release-notes"
          MARKER_WRITE: "<!-- cc-release-notes sha:${{ needs.check-eligibility.outputs.head_sha }} -->"
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/sticky-comment.js');
            await run({ github, context, core });
