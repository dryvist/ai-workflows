# Commit Review
#
# An AI review of every push, on every branch: one comment on the pushed head
# commit. Pull requests already get PR-Agent (pr-agent.yml); this covers the
# commits that never sit in a pull request — direct pushes, work-in-progress
# branches, bot commits — so no commit lands unreviewed.
#
# Every review goes through the org's model router, on the self-hosted pool
# (the only runners that reach it). Repository visibility picks the router KEY
# and ROLE, nothing else:
#
#   private repo -> LLM_ROUTER_API_KEY with `model` (default review-private)
#   public repo  -> LLM_PUBLIC_REVIEW_API_KEY with `public_model`
#                   (default review-public)
#
# Each role carries its own fallback ladder on the router — local rungs first,
# then whatever overflow the role allows — so where a diff may travel is
# decided by the role and the key that may call it, never here. The
# expressions below never read the public key on a private repo; the only
# fall-through is public -> LLM_ROUTER_API_KEY when the public key is unset.
#
# Two contracts, the same as pr-agent.yml:
#
# 1. The runner must reach the router.
# 2. A router that is down or at capacity gets three probes inside fifteen
#    seconds and then the review job FAILS, releasing the runner. It never
#    reports success having reviewed nothing. Do not make it a required check.
#
# The review job holds a read-only token; the comment is posted from a separate
# job with the one write permission it needs (contents: write is what the
# commit-comment endpoint requires). The review text itself is data, never
# interpolated into a command.

name: Commit Review

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          Runner label for the jobs. Must reach the router, which only the
          self-hosted pool does.
        type: string
        required: false
        default: self-hosted
      scripts_ref:
        description: >-
          Commit or ref of dryvist/ai-workflows to take the scripts from.
          Defaults to its default branch, which is what a consumer wants. A
          dogfood caller in this repository passes its own head SHA.
        type: string
        required: false
        default: ""
      model:
        description: >-
          Router ROLE alias called on a private repo. Always an alias the
          router resolves — never a vendor model id — and one
          LLM_ROUTER_API_KEY is scoped to reach. The role's own fallback
          ladder is what absorbs a busy backend.
        type: string
        required: false
        default: review-private
      public_model:
        description: >-
          Router ROLE alias called on a public repo, one
          LLM_PUBLIC_REVIEW_API_KEY is scoped to reach.
        type: string
        required: false
        default: review-public
      max_diff_kb:
        description: "Truncate the pushed diff at this many KiB"
        type: number
        required: false
        default: 150
      max_tokens:
        description: "Completion token ceiling for the review"
        type: number
        required: false
        default: 1500
    secrets:
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
        required: true
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router virtual key for private repositories (never the
          router's master key).
        required: true
      LLM_PUBLIC_REVIEW_API_KEY:
        description: >-
          A second router virtual key, scoped to the public role. Read only
          on a public repo.
        required: false
      LLM_PUBLIC_REVIEW_BASE_URL:
        description: >-
          Deprecated and ignored: every review goes to LLM_ROUTER_BASE_URL.
          Still accepted so existing callers keep validating; drop it from
          callers.
        required: false

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: write

# Per REF. GitHub keeps one running and ONE pending run per group and cancels
# the older pending run when a newer one queues; with a per-repository group, a
# burst of pushes to different branches cancelled every review but the last
# and left the rest red having reviewed nothing. A per-ref group means a
# router outage costs one runner per busy branch for fifteen seconds, no
# more.
# cancel-in-progress stays false — a superseded push's review still queues
# behind the newer one on the same branch rather than being thrown away.
concurrency:
  group: commit-review-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review the push
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    # A branch deletion is a push event with no commit to review.
    if: github.event.deleted != true
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # Enough history to diff a multi-commit push against its base.
          fetch-depth: 50

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ inputs.scripts_ref }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Collect the pushed diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        run: bash .ai-workflows/.github/scripts/commit-review/collect.sh

      - name: Request the review
        id: review
        if: hashFiles('review.skip') == ''
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          endpoint: ${{ secrets.LLM_ROUTER_BASE_URL }}
          token: ${{ !github.event.repository.private && secrets.LLM_PUBLIC_REVIEW_API_KEY || secrets.LLM_ROUTER_API_KEY }}
          model: ${{ github.event.repository.private && inputs.model || inputs.public_model }}
          max-completion-tokens: ${{ inputs.max_tokens }}
          temperature: "0"
          prompt-file: .ai-workflows/.github/scripts/commit-review/commit-review.prompt.yml
          file_input: |
            log: log.txt
            changed: changed.txt
            diff: diff.txt
          custom-headers: "x-langfuse-trace-name: commit-review"

      - name: Render the comment
        env:
          RESPONSE_FILE: ${{ steps.review.outputs.response-file }}
          MODEL: ${{ github.event.repository.private && inputs.model || inputs.public_model }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .ai-workflows/.github/scripts/commit-review/render.sh

      - name: Job summary
        run: cat commit-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-review-${{ github.run_id }}
          path: commit-review.md
          if-no-files-found: error
          retention-days: 7

  comment:
    name: Comment on the commit
    needs: review
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commit-review-${{ github.run_id }}

      - name: Post commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/${GH_REPO}/commits/${COMMIT_SHA}/comments" \
            -F body=@commit-review.md > /dev/null
          echo "Commented on ${COMMIT_SHA}."
