# Docs Sync
#
# Reusable workflow: runs once per merged pull request in a calling ("source")
# repository and asks a coding agent whether that merge changed something the
# private docs site (dryvist/docs-starlight by default) states. When it did,
# the agent edits docs_repo's tree directly and a fresh publisher job opens a
# pull request there from a GitHub-VERIFIED, App-signed commit.
#
# This replaces the per-repo agent rule proposed in
# dryvist/ai-assistant-instructions#851 with one enforced CI job every repo
# inherits by calling this workflow, instead of a convention each agent has
# to remember to follow.
#
# It never edits the calling (source) repository. The only mutation is a PR
# in docs_repo. A merge with nothing docs-relevant, or with nothing stale to
# fix in docs_repo, opens no PR at all — that is the expected, common
# outcome, not a failure.
#
# docs_repo is PRIVATE by default (docs-starlight), so every checkout of it
# needs an App token, not the ambient GITHUB_TOKEN (which only covers the
# calling repo). The agent job mints a READ-ONLY token for that checkout —
# per this repo's "Agent jobs must not receive a write-capable token" rule —
# and the publish job mints a separate, fresh WRITE token for its own
# checkout and the PR it opens.

name: Docs Sync

on:
  workflow_call:
    inputs:
      source_repo:
        description: "owner/repo of the merged pull request (the repo calling this workflow)"
        type: string
        required: true
      pr_number:
        description: "Number of the merged pull request in source_repo"
        type: string
        required: true
      merge_sha:
        description: "Merge commit SHA in source_repo"
        type: string
        required: true
      docs_repo:
        description: "owner/repo of the private docs site this workflow may open a PR against"
        type: string
        required: false
        default: dryvist/docs-starlight
      model:
        description: "Router ROLE alias to call (e.g. cheap, judge, subagent) — never a vendor model id"
        type: string
        required: false
        default: cheap
      runner_label:
        description: "Runner label for the job(s). Must be a runner that can reach the model router."
        type: string
        required: false
        default: self-hosted
      draft_prs:
        description: "Open the resulting PR as a draft instead of ready-for-review"
        type: string
        default: "true"
      daily_run_limit:
        description: "Max workflow runs per calling repo per day (0 to disable)"
        type: string
        default: "10"
      docs_repo_app_id:
        description: >-
          App ID of the GitHub App installed on docs_repo, used to mint both
          the read-only checkout token and the write PR token. See
          docs/docs-sync.md "Which App writes to docs_repo" for the two
          candidate Apps and the confirmation this still needs.
        type: string
        required: true
    secrets:
      LLM_ROUTER_BASE_URL:
        required: true
      LLM_ROUTER_API_KEY:
        required: true
      DOCS_REPO_APP_PRIVATE_KEY:
        description: "Private key of docs_repo_app_id."
        required: true

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  contents: read

concurrency:
  group: docs-sync-${{ inputs.source_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  check-daily-limit:
    name: Check daily run limit
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Check daily run limit
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-daily-limit.js');
            await run({ github, context, core });

  docs-sync:
    name: Check merge and draft docs fix
    needs: check-daily-limit
    if: needs.check-daily-limit.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Mint read-only docs_repo token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.docs_repo_app_id }}
          private-key: ${{ secrets.DOCS_REPO_APP_PRIVATE_KEY }}
          owner: ${{ inputs.docs_repo }}
          repositories: ${{ inputs.docs_repo }}
          permission-contents: read

      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.docs_repo }}
          token: ${{ steps.read-token.outputs.token }}
          persist-credentials: false

      - name: Checkout source repo merge commit (read-only context)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 2
          path: .source-repo
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: ad9697cb92c54e4a41eb778df251cd0b76152eca # bump to the merged commit once dryvist/ai-llm-prompts#62 lands
          sparse-checkout: automation/ai-workflows-docs-sync.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-docs-sync.md SOURCE_REPO PR_NUMBER MERGE_SHA

      # Verified Commit & PR Pattern (docs/PATTERNS.md): the agent only edits
      # the docs_repo checkout and writes its PR description to .claude-pr.md;
      # the publish job below opens a VERIFIED PR against docs_repo from it.
      # The agent itself never holds a write-capable token — only the
      # read-only checkout above and no GitHub credentials at all otherwise.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ inputs.model }}
          codex_model: ${{ inputs.model }}
          allowed_tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git -C .source-repo log:*),Bash(git -C .source-repo diff:*),Bash(git -C .source-repo show:*)"
          permission_profile: workspace
          base_url: ${{ secrets.LLM_ROUTER_BASE_URL }}
          api_key: ${{ secrets.LLM_ROUTER_API_KEY }}

      - name: Collect agent patch
        run: |
          git add -N -A
          git reset -q -- .ai-workflows .ai-llm-prompts .source-repo
          git diff --binary HEAD > agent.patch

      - name: Upload agent patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-sync-${{ github.run_id }}
          path: agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish docs PR
    needs: docs-sync
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    permissions: {}
    steps:
      - name: Mint write docs_repo token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.docs_repo_app_id }}
          private-key: ${{ secrets.DOCS_REPO_APP_PRIVATE_KEY }}
          owner: ${{ inputs.docs_repo }}
          repositories: ${{ inputs.docs_repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.docs_repo }}
          token: ${{ steps.write-token.outputs.token }}
          persist-credentials: false

      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download agent patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-sync-${{ github.run_id }}

      - name: Apply agent patch
        run: |
          if [ -s agent.patch ]; then
            git apply agent.patch
          fi
          rm agent.patch

      - name: Open PR against docs_repo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_REPO: ${{ inputs.docs_repo }}
          PR_BRANCH: claude/docs-sync-${{ github.run_id }}
          PR_DRAFT: ${{ inputs.draft_prs }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: docs-sync
          TRIGGER_ACTOR: ${{ inputs.source_repo }}#${{ inputs.pr_number }}
        with:
          github-token: ${{ steps.write-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/pr-from-file.js');
            await run({ github, context, core });
