name: AI CI

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  ci-suite:
    uses: dryvist/ai-workflows/.github/workflows/suite-ci.yml@d1d335bdb010b47108374e8a6152a7926477a32a # v0.48.1
    with:
      repo_context: "Reusable GitHub Actions workflows for AI-powered CI/CD automation (prompts, scripts, YAML workflows)"
      ci_structure: "test.yml (bun test for JavaScript scripts)"
      workflow_name: "Tests"
    secrets: inherit
