name: Dogfood Scope Classify
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # Unit tests for scripts/scope_classify.py - mocks the typesafe-sdk
  # client, no network call and no TYPESAFE_API_KEY needed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python3 -m unittest scripts/test_scope_classify.py -v

  # Runs the classifier for visibility on this repo's own PRs. Wiring its
  # outputs into this repo's ci-gate.yml (and the dryvist/.github shared
  # reusable workflows) is a follow-up - see the PR description.
  scope:
    uses: ./.github/workflows/scope-classify.yml
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
