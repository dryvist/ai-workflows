name: Dogfood Thread Triage
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  thread-triage:
    uses: ./.github/workflows/thread-triage.yml
    with:
      # Exercise the reviewed pull request's own scripts.
      scripts_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
