# Issue Backlog Sweep
#
# Activates the EXISTING triage -> resolve chain for BACKLOG issues.
#
# The event-driven path (issue-auto-resolve.yml) only resolves issues that carry
# the `ai:ready` label, and nothing ever applies that label to pre-existing
# issues — so backlogs never shrink. This workflow closes that gap:
#
#   1. Claude judges the N oldest UNTRIAGED open issues (read-only) and writes a
#      JSON verdict file — the same triage criteria as issue-triage.md.
#   2. A workflow step applies the triage labels via the JacobPEvans-claude App
#      token. Applying `ai:ready` with an App token FIRES `issues: labeled`,
#      which the consumer's existing issue-auto-resolve.yml picks up and resolves
#      through its full gate stack (author, type, size, ai:ready, excluded
#      labels, attempts, daily limit, PR ceiling).
#
# Claude never applies labels itself: its `gh` uses GITHUB_TOKEN, whose writes do
# NOT trigger downstream workflows (GitHub loop-prevention). The App-token apply
# is what bridges triage to resolution — same "Claude judges, a privileged step
# mutates" split as the Verified Commit & PR pattern.
#
# Throttling (never runs away):
#   - max_issues caps how many issues are labeled per run (default 5).
#   - the downstream resolver's own PR ceiling (5 bot PRs / 24h) is the hard
#     backstop on PRs opened — this sweep cannot exceed it.
#
# This is a reusable workflow that can be called from other repositories.

name: Issue Backlog Sweep

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      max_issues:
        description: "Max backlog issues to label per run"
        type: string
        default: "5"
    # No `secrets:` block: callers forward org-level secrets via `secrets: inherit`.
    # Declaring them here (even required: false) broke workflow_call instantiation
    # for consumers passing org secrets — GitHub startup-failed the caller. The
    # reusable reads GH_ACTION_AI_API_KEY / GH_APP_CLAUDE_BOT_PRIVATE_KEY from the
    # inherited context, same as every other reusable here.
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Max backlog issues to label per run"
        type: string
        default: "5"

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
# NOTE: no `actions: read` here — granting it made cross-repo workflow_call
# consumers fail at startup ("workflow file issue"). The daily-run-limit check
# that needed it was removed; the resolver's 5-PR/24h ceiling is the hard cap.
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-backlog-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-pr-ceiling:
    name: Check bot PR ceiling
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check bot PR ceiling
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/check-pr-ceiling.js');
            await run({ github, context, core });

  sweep:
    needs: [check-pr-ceiling]
    if: needs.check-pr-ceiling.outputs.allowed == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: read
    timeout-minutes: 10
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-issue-backlog-sweep.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          MAX_ISSUES: ${{ inputs.max_issues || '5' }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-issue-backlog-sweep.md MAX_ISSUES

      # Claude only JUDGES (read-only + writes the JSON verdict file). It applies no
      # labels — the App-token step below does that so `ai:ready` fires the resolver.
      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions"
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ vars.GH_ACTION_AI_MODEL_ISSUES || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          permission_profile: workspace
          allowed_tools: "Read,Glob,Grep,LS,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

      - name: Upload triage verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-sweep-${{ github.run_id }}
          path: .backlog-sweep.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Apply backlog triage
    needs: sweep
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download triage verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-sweep-${{ github.run_id }}

      # An App installation token triggers the consumer's issues:labeled workflow.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Apply triage labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MAX_ISSUES: ${{ inputs.max_issues || '5' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/issue-backlog-sweep/apply-labels.js');
            await run({ github, context, core });
