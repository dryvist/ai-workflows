# Issue Linker
#
# Reusable workflow: links open issues to PRs when opened, and closes resolved
# issues when PRs merge.
#
# This is a reusable workflow that can be called from other repositories.

name: Issue Linker

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      model:
        description: "Selected provider model override"
        type: string
        default: ""
      allowed_bots:
        description: "Comma-separated bot logins allowed to trigger review (supports *)"
        type: string
        default: ""
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-linker-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  check-eligibility:
    name: Check eligibility
    if: >-
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      mode: ${{ steps.check.outputs.mode }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Check eligibility
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/issue-linker/check-eligibility.js');
            await run({ github, context, core });

  link-issues:
    name: Link or close issues
    needs: check-eligibility
    if: needs.check-eligibility.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 10
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-issue-linker.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: render-prompt
        env:
          MODE: ${{ needs.check-eligibility.outputs.mode }}
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-issue-linker.md MODE PR_NUMBER

      - name: Run AI agent
        if: >-
          github.event.pull_request.user.type != 'Bot' ||
          contains(inputs.allowed_bots, github.event.pull_request.user.login) ||
          contains(inputs.allowed_bots, '*')
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions"
          claude_model: ${{ inputs.model || vars.GH_ACTION_AI_MODEL_ISSUES || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ inputs.model || vars.GH_ACTION_AI_CODEX_MODEL }}
          prompt: ${{ steps.render-prompt.outputs.content }}
          permission_profile: workspace
          allowed_tools: "Write,Read,Glob,Grep,LS,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search issues:*)"

      - name: Upload issue-linker artifact
        if: >-
          github.event.pull_request.user.type != 'Bot' ||
          contains(inputs.allowed_bots, github.event.pull_request.user.login) ||
          contains(inputs.allowed_bots, '*')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-linker-${{ github.run_id }}
          path: .ai-output/issue-linker.json
          if-no-files-found: error
          retention-days: 1

  publish-links:
    name: Publish issue links
    needs: [check-eligibility, link-issues]
    if: >-
      needs.link-issues.result == 'success' &&
      (github.event.pull_request.user.type != 'Bot' ||
      contains(inputs.allowed_bots, github.event.pull_request.user.login) ||
      contains(inputs.allowed_bots, '*'))
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download issue-linker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-linker-${{ github.run_id }}
          path: .ai-output

      - name: Checkout trusted publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Mint publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Publish validated links
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MODE: ${{ needs.check-eligibility.outputs.mode }}
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
        with:
          github-token: ${{ steps.publisher-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/issue-linker/publish-links.js');
            await run({ github, context, core });
