# Issue Sweeper
#
# Weekly scan of open issues. Comments on progress, closes resolved issues with PR links.
#
# This is a reusable workflow that can be called from other repositories.

name: Issue Sweeper

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-sweeper-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 5
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-issue-sweeper.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-issue-sweeper.md

      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ vars.GH_ACTION_AI_MODEL_ISSUES || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          permission_profile: workspace
          allowed_tools: >-
            Read,Glob,Grep,LS,Write,
            Bash(gh issue view:*),Bash(gh issue list:*),
            Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh search:*),
            Bash(gh api --method GET:*)
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions"

      - name: Upload sweep result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-sweeper-${{ github.run_id }}
          path: .issue-sweeper.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish issue sweep
    needs: sweep
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts/issue-sweeper
          path: .ai-workflows-publisher
          persist-credentials: false

      - name: Download sweep result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-sweeper-${{ github.run_id }}

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Publish sweep result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESULT_FILE: .issue-sweeper.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const publish = require('./.ai-workflows-publisher/.github/scripts/issue-sweeper/publish.js');
            await publish({ github, context, core });
