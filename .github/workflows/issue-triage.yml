# Auto-triage new issues: categorize, deduplicate, label, and comment
name: "Issue Triage"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      issue_number:
        description: "Issue number to triage (dispatch pattern; 0 = from event payload)"
        type: string
        default: "0"
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: issue-triage-${{ github.repository }}

jobs:
  triage:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      issues: write
    timeout-minutes: 5
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout ai-workflows
        uses: actions/checkout@v6
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: |
            .github/prompts
            .github/scripts
          path: .ai-workflows

      - name: Render prompt
        id: prompt
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || '0' }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-workflows/.github/prompts/issue-triage.md ISSUE_NUMBER

      # Use run-claude-code (mints a JacobPEvans-claude App token) instead of the
      # raw action's OIDC exchange: that exchange 401s ("no write access") on
      # private repos where the App has write but the OIDC identity does not.
      - name: Run Claude Code
        uses: dryvist/ai-workflows/.github/actions/run-claude-code@main
        with:
          prompt: ${{ steps.prompt.outputs.content }}
          model: ${{ vars.GH_ACTION_AI_MODEL_ISSUES || vars.GH_ACTION_AI_MODEL }}
          allowed_tools: "Read,Glob,Grep,LS,Bash(gh issue:*),Bash(gh search:*)"
          claude_code_oauth_token: ${{ secrets.GH_ACTION_AI_API_KEY }}
          app_id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          app_private_key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          use_commit_signing: "false"
          allowed_bots: "github-actions"
