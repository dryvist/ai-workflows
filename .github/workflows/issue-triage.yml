# Auto-triage new issues: categorize, deduplicate, label, and comment
name: "Issue Triage"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      issue_number:
        description: "Issue number to triage (dispatch pattern; 0 = from event payload)"
        type: string
        default: "0"
    secrets:
      GH_ACTION_AI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        required: false
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.repository }}

jobs:
  triage:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: read
    timeout-minutes: 5
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-issue-triage.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || '0' }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-issue-triage.md ISSUE_NUMBER

      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ vars.GH_ACTION_AI_MODEL_ISSUES || vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          permission_profile: workspace
          allowed_tools: >-
            Read,Glob,Grep,LS,Write,
            Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions"

      - name: Upload triage result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-triage-${{ github.run_id }}
          path: .issue-triage.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish issue triage
    needs: triage
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts/issue-triage
          path: .ai-workflows-publisher
          persist-credentials: false

      - name: Download triage result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-triage-${{ github.run_id }}

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Publish triage result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXPECTED_ISSUE_NUMBER: ${{ inputs.issue_number || '0' }}
          RESULT_FILE: .issue-triage.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const publish = require('./.ai-workflows-publisher/.github/scripts/issue-triage/publish.js');
            await publish({ github, context, core });
