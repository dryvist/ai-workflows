# Local Review
#
# Advisory PR review by a cheap/local model served through a self-hosted
# OpenAI-compatible router. The model is asked to judge the PR diff against a
# repo-owned checklist file and answer strict JSON; the result is rendered as
# one sticky comment.
#
# Advisory only: model or router failures post "review unavailable: <reason>"
# and the job still succeeds. Only workflow bugs fail it. Never make this a
# required check.
#
# This is a reusable workflow that can be called from other repositories.

name: Local Review

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job on. Defaults to
          ubuntu-latest. Pass a RunsOn label to opt into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      checklist_path:
        description: "Repo-relative path to the review checklist markdown file"
        type: string
        required: false
        default: .github/ai-review/checklist.md
      model:
        description: >-
          Router ROLE alias to call (e.g. cheap, judge, subagent). Always an
          alias the router resolves — never a vendor model id.
        type: string
        required: false
        default: cheap
      max_diff_kb:
        description: "Truncate the diff sent to the model at this many KiB"
        type: number
        required: false
        default: 200
      max_tokens:
        description: "Completion token ceiling for the review call"
        type: number
        required: false
        default: 1500
      base_url_var_name:
        description: >-
          Name of the Actions variable holding the router's OpenAI-compatible
          /v1 base URL. Defaults to LLM_ROUTER_BASE_URL.
        type: string
        required: false
        default: LLM_ROUTER_BASE_URL
    secrets:
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router virtual key (never the router master key). When absent
          the workflow posts "review unavailable" and succeeds.
        required: false

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: local-review-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Local review
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    # Fork guard: same-repo PR heads only, so no secret is exposed to a fork.
    # Draft PRs are skipped — review them when they are ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Collect diff and checklist
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECKLIST_PATH: ${{ inputs.checklist_path }}
          MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        run: bash .ai-workflows/.github/scripts/local-review/collect.sh

      - name: Request review
        env:
          BASE_URL: ${{ vars[inputs.base_url_var_name] }}
          API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          REPO: ${{ github.repository }}
        run: bash .ai-workflows/.github/scripts/local-review/request.sh

      - name: Render comment body
        env:
          MODEL: ${{ inputs.model }}
        run: bash .ai-workflows/.github/scripts/local-review/render.sh

      - name: Post sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BODY_FILE: .local-review.md
          MARKER_MATCH: "<!-- local-review -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/sticky-comment.js');
            await run({ github, context, core });

      - name: Job summary
        run: cat .local-review.md >> "$GITHUB_STEP_SUMMARY"
