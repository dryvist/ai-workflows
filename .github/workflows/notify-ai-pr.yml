# AI PR Notification
#
# Reusable workflow: notifies #github-automation Slack channel when a bot-authored PR opens.
# Filters by bot_login input (default: claude[bot]). Extracts provenance from PR body footer.

name: AI PR Notification

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      bot_login:
        description: "Bot login to filter PRs for (e.g., claude[bot], copilot[bot])"
        type: string
        default: "claude[bot]"
    secrets:
      GH_SLACK_WEBHOOK_URL_GITHUB_AUTOMATION:
        required: true
  workflow_dispatch:
    inputs:
      bot_login:
        description: "Bot login to filter PRs for (e.g., claude[bot], copilot[bot])"
        type: string
        default: "claude[bot]"

permissions:
  pull-requests: read

jobs:
  notify:
    if: github.event.pull_request.user.login == inputs.bot_login
    runs-on: ${{ inputs.runner_label }}
    permissions:
      pull-requests: read
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@v6
        with:
          repository: JacobPEvans/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows

      - name: Send Slack notification
        uses: actions/github-script@v9
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.GH_SLACK_WEBHOOK_URL_GITHUB_AUTOMATION }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO_NAME: ${{ github.repository }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/notification/send-slack-pr-notify.js');
            await run({ github, context, core });
