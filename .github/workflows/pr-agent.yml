# PR Agent
#
# Runs PR-Agent's review, improve and describe tools against the org's model
# router, on the self-hosted pool (the only runners that reach it).
# Repository visibility picks the router KEY and ROLE, nothing else: a private
# repo uses LLM_ROUTER_API_KEY with `model`, a public repo
# LLM_PUBLIC_REVIEW_API_KEY with `public_model`. Each role carries its own
# fallback ladder on the router, so where a diff may travel is decided by the
# role and the key that may call it, never here.
# Per-repository prompt customisation — the review checklist, what "simplify"
# means here, which files to ignore — lives in the consumer's own
# `.pr_agent.toml`, so this workflow carries wiring only.
#
# Two contracts worth knowing before you call it:
#
# 1. The runner must reach the router: the shared self-hosted pool.
# 2. A router that is down or at capacity gets three probes inside fifteen
#    seconds and then the job FAILS, releasing the runner. It never reports
#    success having reviewed nothing. The org ruleset injects this workflow
#    into every pull request as a required check, so an outage blocks merges
#    until it clears and the review is re-fired by a push or a close/reopen.
#
# PR-Agent is invoked as its published container through the CLI it documents,
# not as a container action: this pool passes the Docker socket through without
# a host-identical work directory, so a container action receives an empty
# workspace and no event payload. The CLI needs neither — it reads the pull
# request over the API.
#
# Every expression that carries repository content (the branch name, the pull
# request URL) is passed through `env:` and read as a shell variable, never
# interpolated into a command.

name: PR Agent

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          Runner label for the job. Must reach the router, which only the
          self-hosted pool does.
        type: string
        required: false
        default: self-hosted
      scripts_ref:
        description: >-
          Commit or ref of dryvist/ai-workflows to take the scripts from.
          Defaults to its default branch, which is what a consumer wants.
          `github.job_workflow_sha` is not used: it is empty whenever the
          workflow is reached through another reusable workflow. A dogfood
          caller in this repository passes the pull request head SHA so the
          pull request exercises its own scripts.
        type: string
        required: false
        default: ""
      model:
        description: >-
          Router ROLE alias called on a private repo. Always an alias the
          router resolves — never a vendor model id — and one
          LLM_ROUTER_API_KEY is scoped to reach. The role's own fallback
          ladder is what absorbs a busy backend.
        type: string
        required: false
        default: review-private
      public_model:
        description: >-
          Router ROLE alias called on a public repo, one
          LLM_PUBLIC_REVIEW_API_KEY is scoped to reach.
        type: string
        required: false
        default: review-public
      fallback_models:
        description: >-
          Further router roles, comma-separated, PR-Agent walks in order on a
          private repo when `model` errors. Empty by default: the role
          already carries its ladder on the router.
        type: string
        required: false
        default: ""
      public_fallback_models:
        description: >-
          The same for a public repo, after `public_model`. Must be roles the
          public key may call.
        type: string
        required: false
        default: ""
      max_tokens:
        description: >-
          Input context the alias can be assumed to hold, for PR-Agent's own
          diff-trimming arithmetic (custom_model_max_tokens).
        type: number
        required: false
        default: 32000
      review:
        description: "Run the review tool: verdicts on the diff as one sticky comment."
        type: boolean
        required: false
        default: true
      improve:
        description: "Run the improve tool: code suggestions on the diff."
        type: boolean
        required: false
        default: false
      describe:
        description: >-
          Run the describe tool. It REWRITES the pull request title and body,
          so leave it off wherever something else owns the body (release-please,
          a provenance footer).
        type: boolean
        required: false
        default: false
    secrets:
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
        required: true
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router virtual key for private repositories (never the
          router's master key).
        required: true
      LLM_PUBLIC_REVIEW_API_KEY:
        description: >-
          A second router virtual key, scoped to the public role. Read only
          on a public repo.
        required: false

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  pull-requests: write

# Per PULL REQUEST. GitHub keeps one running and ONE pending run per group and
# cancels the older pending run when a newer one queues; with a per-repository
# group, two sibling pull requests pushing inside one review window cancelled
# the third's required check and left it blocked. A per-PR group means an
# endpoint outage costs one runner per open pull request for fifteen seconds,
# no more. cancel-in-progress stays false — a superseded head's review is
# still queued behind the new one rather than thrown away.
concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    name: PR Agent
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    # Fork guard: same-repo heads only, so no fork sees the router key. Drafts
    # are reviewed too — every pull request gets a review, and a draft is where
    # a finding is cheapest to act on.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ inputs.scripts_ref }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Wait for the router
        env:
          BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          API_KEY: ${{ !github.event.repository.private && secrets.LLM_PUBLIC_REVIEW_API_KEY || secrets.LLM_ROUTER_API_KEY }}
        run: bash .ai-workflows/.github/scripts/shared/wait-for-router.sh

      - name: Run PR-Agent
        env:
          BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          API_KEY: ${{ !github.event.repository.private && secrets.LLM_PUBLIC_REVIEW_API_KEY || secrets.LLM_ROUTER_API_KEY }}
          JOB_TOKEN: ${{ github.token }}
          MODEL: ${{ github.event.repository.private && inputs.model || inputs.public_model }}
          FALLBACK_MODELS: ${{ github.event.repository.private && inputs.fallback_models || (!github.event.repository.private && inputs.public_fallback_models) || '' }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          CONFIG_BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_REVIEW: ${{ inputs.review }}
          RUN_IMPROVE: ${{ inputs.improve }}
          RUN_DESCRIBE: ${{ inputs.describe }}
        run: bash .ai-workflows/.github/scripts/pr-agent/run.sh
