# PR Agent
#
# Runs PR-Agent's review, improve and describe tools against the org's model
# router, on the self-hosted pool (the only runners that reach it).
# Repository visibility picks the router KEY and ROLE, nothing else: a private
# repo uses LLM_ROUTER_API_KEY with `model`, an open-source repo
# LLM_ROUTER_OSS_API_KEY with `oss_model`. Each role carries its own
# fallback ladder on the router, so where a diff may travel is decided by the
# role and the key that may call it, never here.
# Per-repository prompt customisation — the review checklist, what "simplify"
# means here, which files to ignore — lives in the consumer's own
# `.pr_agent.toml`, so this workflow carries wiring only.
#
# Two contracts worth knowing before you call it:
#
# 1. The runner must reach the router: the shared self-hosted pool.
# 2. A router refusal that is a gateway, budget or 429 error fails the job
#    closed, because this is a required check: the job summary says the review
#    was not performed, a check run is posted with conclusion failure, and one
#    ops alert is sent to ntfy. Any other tool failure also fails the job. The
#    job is capped (`timeout_minutes`, ten by default). It never reports success
#    having reviewed nothing.
#
# PR-Agent is invoked as its published container through the CLI it documents,
# not as a container action: this pool passes the Docker socket through without
# a host-identical work directory, so a container action receives an empty
# workspace and no event payload. The CLI needs neither — it reads the pull
# request over the API.
#
# Every expression that carries repository content (the branch name, the pull
# request URL) is passed through `env:` and read as a shell variable, never
# interpolated into a command.

name: PR Agent

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          Runner label for the job. Must reach the router, which only the
          self-hosted pool does.
        type: string
        required: false
        default: self-hosted
      model:
        description: >-
          Router ROLE alias called on a private repo. Always an alias the
          router resolves — never a vendor model id — and one
          LLM_ROUTER_API_KEY is scoped to reach. The role's own fallback
          ladder is what absorbs a busy backend.
        type: string
        required: false
        default: review-private
      oss_model:
        description: >-
          Router ROLE alias called on an open-source repo, one
          LLM_ROUTER_OSS_API_KEY is scoped to reach.
        type: string
        required: false
        default: review-oss
      max_tokens:
        description: >-
          Input context the alias can be assumed to hold, for PR-Agent's own
          diff-trimming arithmetic (custom_model_max_tokens).
        type: number
        required: false
        default: 32000
      timeout_minutes:
        description: >-
          Job cap, and the client deadline PR-Agent hands its completion
          client: one number, so the client never gives up before the job.
        type: number
        required: false
        default: 10
      review:
        description: "Run the review tool: verdicts on the diff as one sticky comment."
        type: boolean
        required: false
        default: true
      improve:
        description: "Run the improve tool: code suggestions on the diff."
        type: boolean
        required: false
        default: false
      describe:
        description: >-
          Run the describe tool. It REWRITES the pull request title and body,
          so leave it off wherever something else owns the body (release-please,
          a provenance footer).
        type: boolean
        required: false
        default: false
    secrets:
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
        required: true
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router virtual key for private repositories (never the
          router's master key).
        required: true
      LLM_ROUTER_OSS_API_KEY:
        description: >-
          A second router virtual key, scoped to the role open-source
          repositories may call. Read only on such a repo.
        required: false
      LLM_PUBLIC_REVIEW_API_KEY:
        description: >-
          Deprecated and ignored, removed next release: pass
          LLM_ROUTER_OSS_API_KEY. Still accepted so existing callers validate.
        required: false
      NTFY_BASE_URL:
        description: >-
          Base URL of the ntfy hub that receives one ops alert (topic "ai")
          when the router is unavailable. Optional: the alert is skipped, not
          failed, when this is absent.
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        description: >-
          Private key of the Claude bot App. Mints the token that posts the
          failure check run on a gateway failure. Without it the job still
          fails, and names the missing key.
        required: false

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  pull-requests: write

# Per PULL REQUEST. GitHub keeps one running and ONE pending run per group and
# cancels the older pending run when a newer one queues; with a per-repository
# group, two sibling pull requests pushing inside one review window cancelled
# the third's required check and left it blocked. A per-PR group means a
# router outage costs one runner per open pull request for one refused
# request, no more. cancel-in-progress stays false — a superseded head's review is
# still queued behind the new one rather than thrown away.
concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    name: PR Agent
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    # Fork guard: same-repo heads only, so no fork sees the router key. Drafts
    # are reviewed too — every pull request gets a review, and a draft is where
    # a finding is cheapest to act on.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Run PR-Agent
        env:
          BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          API_KEY: ${{ !github.event.repository.private && secrets.LLM_ROUTER_OSS_API_KEY || secrets.LLM_ROUTER_API_KEY }}
          JOB_TOKEN: ${{ github.token }}
          MODEL: ${{ github.event.repository.private && inputs.model || inputs.oss_model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          CONFIG_BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_REVIEW: ${{ inputs.review }}
          RUN_IMPROVE: ${{ inputs.improve }}
          RUN_DESCRIBE: ${{ inputs.describe }}
        run: bash .ai-workflows/.github/scripts/pr-agent/run.sh

      # Runs only after a gateway failure: run.sh wrote gateway-reason.txt and
      # failed the job. The check run uses the Claude bot App token, minted here.
      - name: Mint the check-run token
        id: check-token
        if: failure() && hashFiles('gateway-reason.txt') != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-checks: write

      - name: Report gateway unavailability
        if: failure() && hashFiles('gateway-reason.txt') != ''
        env:
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Required check: failure, so the job stays red.
          CONCLUSION: failure
          GITHUB_TOKEN: ${{ steps.check-token.outputs.token }}
          CHECK_TOKEN_CAUSE: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY == '' && 'GH_APP_CLAUDE_BOT_PRIVATE_KEY is not set' || 'the mint step failed' }}
          CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .ai-workflows/.github/scripts/shared/gateway-failure.sh report pr-agent "$(cat gateway-reason.txt)"
