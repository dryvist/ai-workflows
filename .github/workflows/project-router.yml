# Add issues and PRs that carry a type:* label to the org project board.
#
# Native, deterministic replacement for the former AI-driven router. The board
# exposes only Status and Phase fields, so board membership is the meaningful
# action — handled by actions/add-to-project with no model, prompt, or token
# spend. Items are routed only once they are triaged (carry a type:* label),
# preserving the original router's inclusion rule.
name: "Project Router"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      project-url:
        description: >-
          URL of the GitHub Projects v2 board to add matching items to.
          Defaults to the org's primary board; override to route a repo's
          items elsewhere.
        type: string
        required: false
        default: https://github.com/orgs/dryvist/projects/1

permissions:
  contents: read

concurrency:
  group: >-
    project-router-${{ github.repository }}-${{
    github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    # Route only triaged items — those carrying at least one type:* label. An
    # item opened without one is added later, when the type:* label fires the
    # caller's `issues: labeled` trigger.
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'type:') ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'type:')
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Add item to project board
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ steps.app-token.outputs.token }}
