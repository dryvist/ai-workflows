---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: JacobPEvans/.github/.github/workflows/promote-major-tag.yml@b6c7d9be8f93af36e215831b2d28a60e13ab2227 # v1.23.3
    with:
      tag: ${{ github.event.release.tag_name }}
