# Repository Hygiene Digest
#
# Read-only nightly digest of branch, pull request, and promotion state across
# one or more repositories. Every fact is computed with `gh` reads under the
# default token; nothing is created, deleted, merged, or pushed.
#
# A model is used only to write a short natural-language summary of facts that
# were already computed. It needs a runner that can reach the router: an outage
# gets three tries inside fifteen seconds and then fails the job, rather than
# post a digest that quietly lost its summary.
#
# This is a reusable workflow that can be called from other repositories.

name: Repository Hygiene Digest

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          Runner label for the job. Must be a runner that can reach the model
          router.
        type: string
        required: false
        default: self-hosted
      scripts_ref:
        description: >-
          Commit or ref of dryvist/ai-workflows to take the scripts from.
          Defaults to its default branch, which is what a consumer wants.
          `github.job_workflow_sha` is not used: it is empty whenever the
          workflow is reached through another reusable workflow. A dogfood
          caller in this repository passes the pull request head SHA so the
          pull request exercises its own scripts.
        type: string
        required: false
        default: ""
      repos:
        description: >-
          Comma-separated owner/name list to report on. Defaults to the
          calling repository.
        type: string
        required: false
        default: ""
      model:
        description: >-
          Router ROLE alias used ONLY to summarise the computed facts (e.g.
          cheap, judge). Always an alias the router resolves — never a vendor
          model id.
        type: string
        required: false
        default: cheap
      slack:
        description: "Post the digest to Slack when a webhook secret is present"
        type: boolean
        required: false
        default: false
      stale_days:
        description: "A branch with no pull request is stale after this many days"
        type: number
        required: false
        default: 30
      max_tokens:
        description: "Completion token ceiling for the summary call"
        type: number
        required: false
        default: 400
    secrets:
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
        required: true
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router key for CI (never the router's master key).
        required: true
      GH_SLACK_WEBHOOK_URL_GITHUB_AUTOMATION:
        description: "Slack incoming webhook. Only used when the slack input is true."
        required: false

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: repo-hygiene-digest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  digest:
    name: Repository hygiene digest
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    timeout-minutes: 10
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ inputs.scripts_ref }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Collect hygiene facts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOS: ${{ inputs.repos != '' && inputs.repos || github.repository }}
          STALE_DAYS: ${{ inputs.stale_days }}
        run: bash .ai-workflows/.github/scripts/repo-hygiene/collect.sh

      - name: Summarise the facts
        env:
          BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          REPO: ${{ github.repository }}
        run: bash .ai-workflows/.github/scripts/repo-hygiene/summarize.sh

      - name: Render digest
        run: bash .ai-workflows/.github/scripts/repo-hygiene/render.sh

      - name: Job summary
        run: cat repo-hygiene-digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-hygiene-digest
          path: repo-hygiene-digest.md
          if-no-files-found: error

      - name: Post to Slack
        if: inputs.slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.GH_SLACK_WEBHOOK_URL_GITHUB_AUTOMATION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .ai-workflows/.github/scripts/repo-hygiene/slack.sh
