# Hub-and-spoke multi-repo workflow dispatcher
name: "Repository Orchestrator"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: repo-orchestrator-${{ github.repository }}

jobs:
  orchestrate:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
      id-token: write
    timeout-minutes: 5
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout ai-workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: |
            .github/prompts
            .github/scripts
          path: .ai-workflows

      - name: Render prompt
        id: prompt
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-workflows/.github/prompts/repo-orchestrator.md

      - name: Run Claude
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1.0.171
        with:
          claude_code_oauth_token: ${{ secrets.GH_ACTION_AI_API_KEY }}
          allowed_bots: "github-actions"
          prompt: ${{ steps.prompt.outputs.content }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,LS,Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*),Bash(gh workflow:*),Bash(gh api:*),Bash(gh search:*)"
            --model ${{ vars.GH_ACTION_AI_MODEL }}
