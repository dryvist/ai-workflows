# Hub-and-spoke multi-repo workflow dispatcher
name: "Repository Orchestrator"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      workflow_file:
        description: Workflow file to dispatch in each target repository.
        type: string
        required: false
        default: ""
      target_repos:
        description: Comma-separated repository names, or all.
        type: string
        required: false
        default: ""
      target_ref:
        description: Git ref passed to workflow_dispatch.
        type: string
        required: false
        default: main
  workflow_dispatch:
    inputs:
      workflow_file:
        description: Workflow file to dispatch in each target repository.
        type: string
        required: true
      target_repos:
        description: Comma-separated repository names, or all.
        type: string
        required: true
      target_ref:
        description: Git ref passed to workflow_dispatch.
        type: string
        required: false
        default: main

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: write
  contents: read

concurrency:
  group: repo-orchestrator-${{ github.repository }}

jobs:
  orchestrate:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      ANTHROPIC_BASE_URL: ${{ vars.GH_ACTION_AI_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout ai-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false
      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          sparse-checkout: automation/ai-workflows-repo-orchestrator.md
          sparse-checkout-cone-mode: false
          path: .ai-llm-prompts
          persist-credentials: false

      - name: Render prompt
        id: prompt
        env:
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          TARGET_REPOS: ${{ inputs.target_repos }}
          TARGET_REF: ${{ inputs.target_ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash .ai-workflows/.github/scripts/render-prompt.sh .ai-llm-prompts/automation/ai-workflows-repo-orchestrator.md WORKFLOW_FILE TARGET_REPOS TARGET_REF REPOSITORY_OWNER

      - name: Run AI agent
        uses: dryvist/ai-workflows/.github/actions/run-ai-agent@main
        with:
          agent: ${{ vars.GH_ACTION_AI_AGENT || 'claude' }}
          anthropic_api_key: ${{ secrets.GH_ACTION_AI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_responses_api_endpoint: ${{ vars.GH_ACTION_AI_CODEX_RESPONSES_API_ENDPOINT }}
          openai_effort: ${{ vars.GH_ACTION_AI_CODEX_EFFORT }}
          codex_version: ${{ vars.GH_ACTION_AI_CODEX_VERSION }}
          allowed_bots: "github-actions"
          prompt: ${{ steps.prompt.outputs.content }}
          claude_model: ${{ vars.GH_ACTION_AI_MODEL }}
          codex_model: ${{ vars.GH_ACTION_AI_CODEX_MODEL }}
          permission_profile: workspace
          allowed_tools: "Write,Read,Glob,Grep,LS,Bash(gh repo list:*),Bash(gh api --method GET:*)"

      - name: Upload dispatch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-orchestrator-${{ github.run_id }}
          path: .ai-output/repo-orchestrator.json
          if-no-files-found: error
          retention-days: 1

  publish-dispatches:
    name: Publish workflow dispatches
    needs: orchestrate
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Download dispatch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo-orchestrator-${{ github.run_id }}
          path: .ai-output

      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Mint organization publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write

      - name: Publish validated dispatches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          TARGET_REPOS: ${{ inputs.target_repos }}
          TARGET_REF: ${{ inputs.target_ref }}
        with:
          github-token: ${{ steps.publisher-token.outputs.token }}
          script: |
            const run = require('./.ai-workflows/.github/scripts/repo-orchestrator/publish-dispatches.js');
            await run({ github, context, core });
