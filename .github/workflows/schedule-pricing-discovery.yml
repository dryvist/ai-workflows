# Weekly trigger for Pricing Discovery (agents file W1 D1). Runs on the
# shared self-hosted pool (no Mac, no GPU needed). timeout-minutes bounds a
# job only once it has a runner: the previous `proxmox-fleet` label matched no
# runner, so each weekly run sat queued for the 24 h GitHub allows and was
# cancelled having done nothing.
name: Schedule Pricing Discovery

on:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print bodies only; open/file/edit nothing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discover:
    permissions:
      contents: read
    uses: ./.github/workflows/pricing-discovery.yml
    with:
      runner_label: self-hosted
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VIKUNJA_URL: ${{ secrets.VIKUNJA_URL }}
      VIKUNJA_API_TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
