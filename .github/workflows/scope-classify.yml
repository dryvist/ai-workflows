# Scope Classify
#
# Content-aware CI-scope gate. Runs first in a caller's CI gate and
# returns `outputs` (ci, molecule, ai_review, release_notes, e2e, reason,
# source) that downstream reusable jobs gate on, e.g.
# `if: needs.scope.outputs.ci == 'full'`. A skipped job still satisfies a
# required status check, so the merge gate stays green when this job
# decides a check was not needed. This job itself always runs and always
# writes its decision, the reason, and the source to its own summary —
# that is the audit trail for a gate that can now skip required work.
#
# All decision logic lives in scripts/scope_classify.py (unit tested:
# scripts/test_scope_classify.py), not in this YAML. This step is a
# single invocation; the script fetches the pull request context, hands
# it with the rubric (.github/scope-rubric.md) to typesafe.ai's official
# `typesafe-sdk` (never a hand-rolled HTTP request), and writes the
# answer. Every scope rule, always-full paths included, lives in the
# rubric the classifier reads; the script decides nothing but "no pull
# request, nothing to classify".
#
# Fail-safe: `timeout-minutes: 2` on the job, a 10s client-side timeout
# on the SDK call. Any request failure, non-2xx response, timeout, or
# unparsable answer resolves every output to the safe full/yes value
# with `source: fallback` - the same value a non-pull_request event
# produces. The script never lets an exception escape without writing
# that fallback decision to the summary first.

name: Scope Classify

on:
  workflow_call:
    outputs:
      ci:
        description: full | lint-only | none
        value: ${{ jobs.scope.outputs.ci }}
      molecule:
        description: full | changed-roles | none
        value: ${{ jobs.scope.outputs.molecule }}
      ai_review:
        description: "yes | no"
        value: ${{ jobs.scope.outputs.ai_review }}
      release_notes:
        description: "yes | no"
        value: ${{ jobs.scope.outputs.release_notes }}
      e2e:
        description: "yes | no"
        value: ${{ jobs.scope.outputs.e2e }}
      reason:
        description: One-line explanation of the decision
        value: ${{ jobs.scope.outputs.reason }}
      source:
        description: jev | fallback
        value: ${{ jobs.scope.outputs.source }}
    secrets:
      TYPESAFE_API_KEY:
        description: >-
          Bearer token for the typesafe.ai API. Not `required: true`: a
          caller several `workflow_call` layers away (e.g. dryvist/.github's
          `_ci-gate.yml`) may not have this secret plumbed all the way
          through yet. An absent/empty key fails the SDK call, which the
          fail-safe already turns into source=fallback, full/yes - the
          safe default, not a startup error.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ci: ${{ steps.classify.outputs.ci }}
      molecule: ${{ steps.classify.outputs.molecule }}
      ai_review: ${{ steps.classify.outputs.ai_review }}
      release_notes: ${{ steps.classify.outputs.release_notes }}
      e2e: ${{ steps.classify.outputs.e2e }}
      reason: ${{ steps.classify.outputs.reason }}
      source: ${{ steps.classify.outputs.source }}
    steps:
      # Explicitly dryvist/ai-workflows, not the default (the CALLER's own
      # repo) - this job needs nothing from the caller's checkout (every
      # PR fact it needs comes from the GitHub API, not local git), only
      # its own scripts/ and rubric, which live here regardless of who
      # calls this reusable workflow. `ref: job.workflow_sha` pins to the
      # commit THIS reusable workflow was loaded from (not `main`, which
      # could be ahead or behind), however deep the workflow_call nesting.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            scripts
            .github/scope-rubric.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - run: pip install -r scripts/requirements-scope-classify.txt

      # No continue-on-error: the script never raises past main() (every
      # failure resolves to a written full/fallback decision), so if this
      # step DOES fail red, that is real - pip, setup, or a bug - and must
      # stay visible rather than leave $GITHUB_OUTPUT empty, which would
      # make every downstream `if: needs.scope.outputs.ci == 'full'` read
      # false and skip required work behind a green board.
      - name: Classify CI scope
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/scope_classify.py
