# Suite: All
#
# Reusable workflow: top-level coordinator for standard repos.
# Routes workflow_dispatch → suite-post-merge. CI (workflow_run), PR, and issue
# events stay in caller-side files — they require repo-specific trigger config.
#
# Nesting: caller → suite-all → suite-post-merge → individual workflow
# = 3 levels (well within the 4-level GitHub Actions limit).
#
# Internal uses: paths are relative — they resolve to the same ref as this
# suite when called by a child repo (e.g., @main rides the whole chain).
#
# Usage:
#   uses: dryvist/ai-workflows/.github/workflows/suite-all.yml@main
#   with:
#     caller_event: ${{ github.event_name }}
#     commit_sha: ${{ inputs.commit_sha || github.sha }}

name: "Suite: All"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      caller_event:
        description: "Event that triggered the caller (pass github.event_name)"
        type: string
        required: true
      commit_sha:
        description: "Commit SHA for post-merge reviews (from workflow_dispatch)"
        type: string
        default: ""
  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  # workflow_dispatch → Post-Merge Suite (docs-review + tests-review)
  post-merge-suite:
    if: inputs.caller_event == 'workflow_dispatch'
    uses: ./.github/workflows/suite-post-merge.yml
    with:
      runner_label: ${{ inputs.runner_label || 'ubuntu-latest' }}
      commit_sha: ${{ inputs.commit_sha }}
    secrets: inherit
