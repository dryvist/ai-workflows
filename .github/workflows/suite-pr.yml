# Suite: PR Reviews
#
# Reusable workflow: bundles final-pr-review.
# Callers pass caller_event to route to the correct individual workflow.
#
# Internal uses: paths are relative — they resolve to the same ref as this
# suite when called by a child repo (e.g., @v0.8.0 pins the whole chain).
#
# Usage:
#   uses: dryvist/ai-workflows/.github/workflows/suite-pr.yml@v0.8.0
#   with:
#     caller_event: ${{ github.event_name }}

name: "Suite: PR Reviews"

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-latest. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      caller_event:
        description: "Event that triggered the caller (pass github.event_name)"
        type: string
        required: true
      allowed_bots:
        description: "Comma-separated bot logins allowed to trigger review (supports *)"
        type: string
        default: ""

  workflow_dispatch:

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  final-pr-review:
    if: >-
      inputs.caller_event == 'pull_request_review' ||
      inputs.caller_event == 'check_suite'
    uses: ./.github/workflows/final-pr-review.yml
    with:
      runner_label: ${{ inputs.runner_label || 'ubuntu-latest' }}
      allowed_bots: ${{ inputs.allowed_bots }}
    secrets: inherit
