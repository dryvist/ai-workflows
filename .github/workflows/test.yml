name: Tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'tests/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - 'tests/**'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test
