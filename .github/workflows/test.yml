name: Tests
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'package.json'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bash .github/scripts/ci/repo-tests.sh
      - name: Fetch PR base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Check permission ceiling against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun .github/scripts/permission-ceiling/ceiling.js check
