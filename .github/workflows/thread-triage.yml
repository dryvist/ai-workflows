# Thread Triage
#
# Triage of the unresolved review threads on a pull request, by a cheap model
# served through the org's OpenAI-compatible model router. Each thread is
# classified outdated | addressed | needs-code | needs-human and the verdicts
# are rendered as one sticky comment.
#
# Why: the premium-model responder and the resolve-pr-threads skill both begin
# by reading every unresolved thread to decide which ones still matter. That
# first pass is classification, not authorship, so it belongs on the cheap
# router role.
#
# It never resolves a thread, never replies in one, and never edits code.
#
# A router outage FAILS the job at once, releasing the runner; it never
# reports success having triaged nothing. It needs a runner that can reach the router. Do not make it
# a required check.
#
# This is a reusable workflow that can be called from other repositories.

name: Thread Triage

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          Runner label for the job. Must be a runner that can reach the model
          router.
        type: string
        required: false
        default: self-hosted
      model:
        description: >-
          Router ROLE alias to call (e.g. cheap, judge, subagent). Always an
          alias the router resolves — never a vendor model id.
        type: string
        required: false
        default: cheap
      max_threads:
        description: "Triage at most this many unresolved threads"
        type: number
        required: false
        default: 20
      max_tokens:
        description: "Completion token ceiling for the triage call"
        type: number
        required: false
        default: 1200
    secrets:
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
        required: true
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router key for CI (never the router's master key).
        required: true

# Workflow-level permissions set the maximum for all jobs.
# permissions: {} silently skips all jobs in cross-repo calls.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: thread-triage-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage review threads
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    permissions:
      contents: read
      pull-requests: write
    # Fork guard: same-repo PR heads only, so no secret is exposed to a fork.
    # Loop guard: our own bots' replies are themselves review-comment events.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != 'jacobpevans-claude[bot]' &&
      github.event.sender.login != 'claude[bot]' &&
      github.event.sender.login != 'github-actions[bot]'
    timeout-minutes: 10
    steps:
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Collect unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_THREADS: ${{ inputs.max_threads }}
        run: bash .ai-workflows/.github/scripts/thread-triage/collect.sh

      - name: Request triage
        id: triage
        if: hashFiles('triage.empty') == ''
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          endpoint: ${{ secrets.LLM_ROUTER_BASE_URL }}
          token: ${{ secrets.LLM_ROUTER_API_KEY }}
          model: ${{ inputs.model }}
          max-completion-tokens: ${{ inputs.max_tokens }}
          temperature: "0"
          prompt-file: .ai-workflows/.github/scripts/thread-triage/thread-triage.prompt.yml
          file_input: |
            threads: threads.json
          custom-headers: "x-langfuse-trace-name: thread-triage"

      - name: Render comment body
        env:
          RESPONSE_FILE: ${{ steps.triage.outputs.response-file }}
          MODEL: ${{ inputs.model }}
        run: bash .ai-workflows/.github/scripts/thread-triage/render.sh

      - name: Post sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BODY_FILE: .thread-triage.md
          MARKER_MATCH: "<!-- thread-triage -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/sticky-comment.js');
            await run({ github, context, core });

      - name: Job summary
        run: cat .thread-triage.md >> "$GITHUB_STEP_SUMMARY"
