# Example consumer caller for the PR review responder.
#
# Drop this in your repo at .github/workflows/pr-review-responder.yml.
#
# What it does: when a reviewer submits a review or leaves a review comment on a PR,
# Claude evaluates the unresolved threads, commits fixes for the valid feedback,
# replies, and resolves them. It NEVER merges. CI failures are out of scope here
# (wire cc-ci-fix.yml for those); noise threads (outdated / failed bot reviews) are
# handled cheaply by review-thread-resolver.yml.
#
# Event-driven, not scheduled: a review IS the event, so no cron and no enumeration
# are needed. The reusable's fork guard + own-bot loop guard keep it safe.

name: PR Review Responder

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  id-token: write
  pull-requests: write

# Do NOT add a caller-level `concurrency:` here. The reusable already sets a per-PR
# group; reusing its exact group would 0-job startup-fail the run.

jobs:
  respond:
    uses: dryvist/ai-workflows/.github/workflows/cc-pr-review-responder.yml@main
    # Optional: a one-line repo description helps Claude judge feedback.
    # with:
    #   repo_context: "Terraform modules for the homelab Proxmox cluster."
    #
    # Forward only the two secrets the reusable declares — explicit and
    # zizmor-clean, no `secrets: inherit`.
    secrets:
      GH_ACTION_AI_API_KEY: ${{ secrets.GH_ACTION_AI_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
